const ROLE = {}; D.roles.forEach(([k, l, m]) => ROLE[k] = { l, m });
const FROLE = {}; D.froles.forEach(([k, l, m]) => FROLE[k] = { l, m });
const ROLE_ORDER = ["own", "coown", "steward", "close", "out"];
const FROLE_ORDER = ["own", "ownx", "coown", "steward", "close", "out"];
const INSCOPE = ["own", "ownx", "coown", "steward"];
const STATUS = { covered: "Covered", new: "Covered (new in v2)", partial: "Partly covered", gap: "Gap" };
const STATUS_SHORT = { covered: "Covered", new: "New in v2", partial: "Partly covered", gap: "Gap" };
const STATUS_ORDER = ["covered", "new", "partial", "gap"];
const FN_NAME = { TA: "TA", Trustee: "Trustee", RPS: "RPS", All: "All" };
const AREA = {}; D.areas.forEach(a => AREA[a.id] = a);
const domsBy = r => D.doms.filter(d => d.role === r);
const GAP = {}; D.gapsOpen.forEach(g => GAP[g[0]] = g);
const andList = xs => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`;
const OPEN_GAPS = andList(D.gapsOpen.map(g => g[0]));
const NUMWORD = n => ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"][n] || String(n);

/* the proposed AFSG role for a use case: the role of its primary home; a gap takes the role of the domain it would be added to */
function ucRole(u) {
  if (u.status === "gap") { const n = D.gapHome[u.gap]; return n ? { r: DOM[n].role, n, gap: true } : { r: "", n: "", gap: true }; }
  const h = FAM[u.homes[0][1]]; const fr = h.f.role;
  if (fr === "ownx") return { r: "own", n: h.d.n, x: true };
  if (["own", "coown", "steward"].includes(fr)) return { r: fr, n: h.d.n };
  return { r: h.d.role === "close" ? "close" : "out", n: h.d.n };
}
D.uc.forEach(u => { u.role = ucRole(u); u.fns = u.fn[0] === "All" ? ["TA", "Trustee", "RPS"] : u.fn; });
const UC_BY_DOM = {};
D.uc.forEach(u => new Set(u.homes.map(h => h[0])).forEach(n => (UC_BY_DOM[n] = UC_BY_DOM[n] || []).push(u)));

/* ---------- small renderers ---------- */
const roleChip = (r, opts = {}) => r ? `<span class="rc ${r}${opts.fill ? " f" : ""}${opts.big ? " big" : ""}" title="${esc(opts.title || ROLE[r].m)}">${esc(opts.label || ROLE[r].l)}</span>` : `<span class="rc out">To decide</span>`;
/* a domain's role, with its qualified label where the curated data gives one (15: own, with carve-outs) */
const domRoleChip = (d, opts = {}) => roleChip(d.role, { fill: d.role === "own" || d.role === "coown", ...opts, ...(d.rq ? { label: d.rq.l, title: d.rq.m } : {}) });
const domNum = n => DOM[n].rq ? `${n} (${DOM[n].rq.l.replace(/^Own,\s*/, "").toLowerCase()})` : n;
const froleChip = r => `<span class="rc ${r}" title="${esc(FROLE[r].m)}">${esc(FROLE[r].l)}</span>`;
const stBadge = s => `<span class="st ${s}">${esc(STATUS[s])}</span>`;
const dhref = (n, code, oi, ai) => `#/domain/${n}` + (code ? `/${encodeURIComponent(code)}` : "") + (oi != null ? `/${oi}` : "") + (ai != null ? `/${ai}` : "");
const domChip = n => { const d = DOM[n]; return `<a class="dchip" style="--rc:var(--r-${d.role})" href="${dhref(n)}"${d.rq ? ` title="${esc(d.rq.l)}: ${esc(d.rq.m)}"` : ""}><b>${n}</b>${esc(d.name)}</a>`; };
const famLink = (n, code) => { const x = FAM[code]; return `<a href="${dhref(n, code)}">${esc(n)} ${esc(x.f.name)}</a>`; };
const fnChips = u => (u.fn[0] === "All" ? ["All"] : u.fn).map(f => `<span class="fnc">${esc(FN_NAME[f])}</span>`).join(" ");
const v2Badge = f => f.v2 === "new" ? ` <span class="badge v2">New in v2</span>` : f.v2 === "widened" ? ` <span class="badge v2w">Widened in v2</span>` : "";
const counts = () => { const c = { covered: 0, new: 0, partial: 0, gap: 0 }; D.uc.forEach(u => c[u.status]++); return c; };
function cbar(c) {
  const tot = STATUS_ORDER.reduce((s, k) => s + c[k], 0) || 1;
  return `<div class="cbar" role="img" aria-label="${STATUS_ORDER.map(k => `${c[k]} ${STATUS[k]}`).join(", ")}">${STATUS_ORDER.map(k => c[k] ? `<i class="${k}" style="width:${(100 * c[k] / tot).toFixed(2)}%" title="${c[k]} ${esc(STATUS[k])}"></i>` : "").join("")}</div>`;
}
function homeHtml(h) {
  const [n, code, objs] = h, x = FAM[code];
  return `<div class="home"><a class="hf" href="${dhref(n, code)}">${esc(x.f.name)}</a>${v2Badge(x.f)} <span class="hd" title="${esc(DOM[n].name)}">${n} ${esc(DOM[n].name)}</span>` +
    (objs.length ? `<span class="ho">${objs.map(o => { const oi = x.f.o.findIndex(y => y.n === o); return `<a href="${dhref(n, code, oi)}" style="color:inherit">${esc(o)}</a>`; }).join(" · ")}</span>` : "") + `</div>`;
}

/* ---------- pages ---------- */
function pageOverview() {
  const c = counts(), N = D.uc.length, cov = c.covered + c.new;
  const own = domsBy("own"), co = domsBy("coown"), st = domsBy("steward"), cl = domsBy("close");
  const word = n => ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"][n] || fmt(n);
  const ownNames = ["15", "13", "29", "16"].filter(n => DOM[n] && DOM[n].role === "own").concat(own.map(d => d.n).filter(n => !["15", "13", "29", "16"].includes(n)));
  const roleCount = r => D.doms.filter(d => d.role === r).length;
  const famsIn = (dr, fr) => D.doms.filter(d => d.role === dr).reduce((t, d) => t + d.f.filter(f => f.role === fr).length, 0);
  return `
  <section class="hero">
    <span class="eyebrow">AFSG · American Funds Service Group · outside-in reading of the reference data taxonomy</span>
    <h1>Where AFSG data aligns to</h1>
    <div class="chips">${ownNames.map(n => domChip(n)).join("")}${co.map(d => domChip(d.n)).join("")}</div>
    <div class="chips">${roleChip("own", { fill: 1 })}<span class="muted" style="font-size:13px">${own.map(d => d.rq ? `<span title="${esc(d.rq.m)}">${esc(domNum(d.n))}</span>` : d.n).join(", ")}</span>
      ${roleChip("coown", { fill: 1 })}<span class="muted" style="font-size:13px">${co.map(d => d.n).join(", ")}</span>
      ${roleChip("steward")}<span class="muted" style="font-size:13px">${st.map(d => d.n).join(", ")}</span>
      ${roleChip("close")}<span class="muted" style="font-size:13px">${cl.map(d => d.n).join(", ")}</span></div>
  </section>

  <section>
    <div class="qa">
      <div class="box"><span class="eyebrow">Question 1</span><div class="q">Are all of AFSG's data use cases captured in the reference taxonomy?</div>
        <p class="a"><b>${cov} of ${N}</b> use cases are covered today, <b>${c.new}</b> of them by families added in v2. <b>${c.partial}</b> are partly covered, ${D.gapsOpen.length ? `and <b>${c.gap}</b> fall in the open gap${D.gapsOpen.length === 1 ? "" : "s"} ${OPEN_GAPS}.` : "and none falls in an open gap."}</p>
        ${cbar(c)}
        <div class="chips">${STATUS_ORDER.map(k => `<a href="#/usecases?status=${k}" style="text-decoration:none">${stBadge(k)}</a> <span class="mono">${c[k]}</span>`).join(" ")}</div>
        <a class="more" href="#/usecases">See every use case and where it lives</a></div>
      <div class="box"><span class="eyebrow">Question 2</span><div class="q">Which domains and families should AFSG own, co-own, steward or stay close to?</div>
        <p class="a">Own <b>${own.map(d => domNum(d.n)).join(", ")}</b>: ${famsIn("own", "own")} families owned outright${famsIn("own", "ownx") ? ` and ${famsIn("own", "ownx")} owned with carve-outs by account type` : ""}, with ${famsIn("own", "steward")} more stewarded and ${famsIn("own", "out")} left outside AFSG. Co-own <b>${co.map(d => d.n).join(", ")}</b> with the enterprise owner: ${famsIn("coown", "coown")} families co-owned, ${famsIn("coown", "steward")} stewarded. Steward ${famsIn("steward", "steward")} families in ${st.length} domains owned elsewhere. Stay close to ${cl.length} domains AFSG depends on.</p>
        <div class="chips">${ROLE_ORDER.slice(0, 4).map(r => `${roleChip(r)} <span class="mono">${roleCount(r)}</span>`).join(" ")}</div>
        <a class="more" href="#/landscape">See all ${D.doms.length} domains by role</a></div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>What AFSG does</h2><p>Capital Group's service organization: three functions, each with its own responsibilities and economics.</p></div>
    <div class="grid g3">${D.functions.map(([k, name, ent, what]) => `<div class="box acc"><span class="eyebrow">${esc(k)}</span><h3>${esc(name)}</h3><p style="color:var(--ink)">${esc(ent)}</p><p>${esc(what)}</p></div>`).join("")}</div>
  </section>




  <section>
    <div class="sec-h"><h2>The four roles</h2><p>Set per data family, so a domain can be owned with carve-outs or stewarded in slices. Ownership follows accountability for the record, not the system that holds it.</p></div>
    <div class="grid">${ROLE_ORDER.slice(0, 4).map(r => `<div class="box acc" style="--rc:var(--r-${r})"><div class="chips">${roleChip(r, { fill: r === "own" || r === "coown" })}<span class="mono muted">${plural(roleCount(r), "domain")}</span></div><p style="color:var(--ink)">${esc(ROLE[r].m)}</p><div class="chips">${D.doms.filter(d => d.role === r).map(d => `<a class="mono" href="${dhref(d.n)}" title="${esc(d.name)}${d.rq ? ` · ${esc(d.rq.l)}` : ""}">${esc(domNum(d.n))}</a>`).join(" ")}</div></div>`).join("")}</div>
  </section>

  <section>
    <div class="sec-h"><h2>Decisions for AFSG leadership</h2><p>Seven decisions turn this proposal into named ownership.</p></div>
    <ol class="decs compact">${D.decisions.map(([t, d]) => `<li><b>${esc(t)}</b><p>${esc(d)}</p></li>`).join("")}</ol>
    <p style="margin-top:12px"><a class="more" href="#/gaps">Gaps and decisions in full</a></p>
  </section>`;
}

let LAND_ONLY = false;
function pageLandscape() {
  const w = { own: 4, coown: 3, steward: 2, close: 1, out: 0 };
  const areas = D.areas.map(a => ({ a, ds: D.doms.filter(d => d.area === a.id) }))
    .map(x => ({ ...x, wt: x.ds.reduce((s, d) => s + w[d.role], 0) }))
    .sort((x, y) => y.wt - x.wt || (x.a.band - y.a.band));
  const tile = d => {
    const info = d.info || {};
    const why = d.rq ? d.rq.m : info.scope && d.role === "own" ? "" : info.stewards ? `AFSG stewards: ${info.stewards}` : info.close ? `AFSG depends on: ${info.close}` : "";
    const fams = d.f.map(f => `<span class="fc ${f.role}${f.v2 === "new" ? " v2" : ""}" title="${esc(f.name)} · ${esc(FROLE[f.role].l)}">${esc(f.code)}</span>`).join("");
    const rel = d.f.filter(f => f.role !== "out").length;
    return `<a class="dt ${d.role}" style="--rc:var(--r-${d.role})" href="${dhref(d.n)}">
      <div class="hd"><div><span class="n">${d.n} · ${esc(d.code)}</span><h4>${esc(d.name)}</h4></div>${d.role !== "out" ? domRoleChip(d) : ""}</div>
      ${why ? `<div class="why">${esc(why)}</div>` : ""}
      <div class="fams">${fams}</div>
      <div class="why">${d.scope.ownx ? `${d.scope.own} families owned, ${d.scope.ownx} owned with carve-out` : rel ? `${rel} of ${d.f.length} families marked for AFSG` : `${d.f.length} families`}</div></a>`;
  };
  const order = { own: 0, coown: 1, steward: 2, close: 3, out: 4 };
  return `
  <section class="hero" style="padding-bottom:0">
    <span class="eyebrow">Landscape</span>
    <h1>All ${D.doms.length} reference domains, colored by the role proposed for AFSG</h1>
    <p class="lede">Each tile lists the domain's families. Families AFSG owns, co-owns, stewards or relies on are marked; click a tile to open the domain.</p>
  </section>
  <section style="padding-top:18px">
    <div class="legend">${ROLE_ORDER.map(r => `<span class="lg">${r === "out" ? `<span class="rc out">${esc(ROLE.out.l)}</span>` : roleChip(r, { fill: r === "own" || r === "coown" })} <span class="mono">${D.doms.filter(d => d.role === r).length}</span></span>`).join("")}</div>
    <div class="legend" style="margin-top:10px">Families: ${["own", "ownx", "coown", "steward", "close"].map(r => `<span class="lg"><span class="fc ${r}">CODE</span> ${esc(FROLE[r].l)}</span>`).join("")}<span class="lg"><span class="fc">CODE</span> Outside AFSG</span><span class="lg"><span class="fc own v2">CODE</span> Family new in v2</span></div>
    <div class="toolbar"><button class="xbtn" id="landonly" aria-pressed="${LAND_ONLY}">Only domains with an AFSG role</button></div>
    <div id="land" class="${LAND_ONLY ? "dim" : ""}">
    ${areas.map(({ a, ds }) => {
      const roles = ROLE_ORDER.slice(0, 4).map(r => [r, ds.filter(d => d.role === r).length]).filter(x => x[1]);
      return `<div class="area"><div><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="meta">${roles.length ? roles.map(([r, k]) => `<span>${esc(ROLE[r].l)}: ${k}</span>`).join("") : "<span>No AFSG role</span>"}</div></div>
      <div class="dtiles">${ds.slice().sort((x, y) => order[x.role] - order[y.role] || x.n.localeCompare(y.n)).map(tile).join("")}</div></div>`; }).join("")}
    </div>
  </section>`;
}

const UCF = { status: "", fn: "", role: "", theme: "", src: "", q: "" };
function ucMatch(u) {
  if (UCF.status && u.status !== UCF.status) return false;
  if (UCF.fn && !u.fns.includes(UCF.fn)) return false;
  if (UCF.role && u.role.r !== UCF.role) return false;
  if (UCF.theme && u.theme !== UCF.theme) return false;
  if (UCF.src && !(UCF.src === "atlas" ? ["IAH", "ITH", "RPH", "CDM", "SIOM", "SNM"].includes(u.source) : UCF.src === "plan" ? ["INIT", "MEAS"].includes(u.source) : /^C\d/.test(u.source))) return false;
  if (UCF.q) {
    const t = [u.title, u.note, D.sources[u.source], u.theme, u.gap, u.was, ...u.homes.flatMap(h => [h[0], DOM[h[0]].name, FAM[h[1]].f.name, ...h[2]])].join(" ").toLowerCase();
    if (!UCF.q.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false;
  }
  return true;
}
function ucRow(u) {
  const r = u.role;
  const roleHtml = r.gap ? (r.r ? `${roleChip(r.r, { fill: r.r === "own" || r.r === "coown" })}<span>once added to ${esc(r.n)}</span>` : `${roleChip("")}<span>home not yet decided</span>`)
    : `${roleChip(r.r, { fill: r.r === "own" || r.r === "coown", ...(r.x ? { label: FROLE.ownx.l, title: FROLE.ownx.m } : {}) })}<span>${esc(r.n)} ${esc(DOM[r.n].name)}</span>`;
  return `<div class="uc" id="uc-${esc(u.id)}">
    <div><div class="t">${esc(u.title)}</div><div class="meta"><span class="src">${esc(D.sources[u.source])}</span> ${fnChips(u)}</div></div>
    <div><span class="lab">Reference home</span><div class="homes">${u.homes.map(homeHtml).join("")}</div></div>
    <div><span class="lab">Coverage</span>${stBadge(u.status)}${u.gap ? ` <a class="mono" href="#/gaps">${esc(u.gap)}</a>` : ""}${u.was ? ` <a class="mono" href="#/gaps" title="Gap closed since v2">${esc(u.was)} closed</a>` : ""}<div class="note">${esc(u.note)}</div></div>
    <div><span class="lab">Proposed AFSG role</span><div class="rolecell">${roleHtml}</div></div>
  </div>`;
}
function renderUcList() {
  const list = D.uc.filter(ucMatch);
  const c = { covered: 0, new: 0, partial: 0, gap: 0 }; list.forEach(u => c[u.status]++);
  $("#ucsum").innerHTML = `Showing <b>${list.length}</b> of ${D.uc.length} use cases${list.length ? ` · ${STATUS_ORDER.filter(k => c[k]).map(k => `${c[k]} ${STATUS_SHORT[k].toLowerCase()}`).join(", ")}` : ""}`;
  document.querySelectorAll("#uctiles .tile").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === UCF.status)));
  $("#uclist").innerHTML = list.length ? D.themes.map(t => {
    const us = list.filter(u => u.theme === t);
    return us.length ? `<div class="ucgroup"><h3>${esc(t)} <small>${plural(us.length, "use case")}</small></h3>
      <div class="uchead"><div>Use case</div><div>Reference home</div><div>Coverage</div><div>Proposed AFSG role</div></div>${us.map(ucRow).join("")}</div>` : "";
  }).join("") : `<p class="muted" style="padding:20px 0">No use case matches these filters.</p>`;
}
function pageUseCases(focus) {
  const c = counts(), N = D.uc.length;
  const sel = (id, label, opts, val) => `<select id="${id}" aria-label="${esc(label)}"><option value="">${esc(label)}: all</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const btns = (key, opts) => opts.map(([v, l]) => `<button class="xbtn" data-k="${key}" data-v="${esc(v)}" aria-pressed="${UCF[key] === v}">${esc(l)}</button>`).join("");
  return `
  <section class="hero" style="padding-bottom:0">
    <span class="eyebrow">Use cases</span>
    <h1>Are all of AFSG's data use cases captured in the reference taxonomy?</h1>
    <p class="lede">${N} use cases drawn from the Atlas products, AFSG's service initiatives and measures, and AFSG's own five-part data chain. Each is mapped to the objects that hold its data and judged on what those objects actually contain.</p>
  </section>
  <section style="padding-top:20px">
    <div class="tiles" id="uctiles">
      <button class="tile" data-s=""><b>${N}</b><span>All use cases</span><small>Atlas ${D.uc.filter(u => ["IAH", "ITH", "RPH", "CDM", "SIOM", "SNM"].includes(u.source)).length} · initiatives and measures ${D.uc.filter(u => ["INIT", "MEAS"].includes(u.source)).length} · AFSG chain ${D.uc.filter(u => /^C\d/.test(u.source)).length}</small></button>
      ${STATUS_ORDER.map(k => `<button class="tile" data-s="${k}"><b>${c[k]}</b><span>${stBadge(k)}</span><small>${{ covered: "The data has a home today.", new: "Covered by a family new or widened in v2.", partial: "Some of the data has a home; the rest is named.", gap: D.gapsOpen.length ? `Open gap${D.gapsOpen.length === 1 ? "" : "s"} ${OPEN_GAPS}.` : "No open gaps; closed gaps are in the decision log." }[k]}</small></button>`).join("")}
    </div>
    <div style="margin:14px 0 18px">${cbar(c)}</div>
    <div class="filters">
      <div class="frow"><span class="lab">Coverage</span>${btns("status", [["", "All"], ...STATUS_ORDER.map(k => [k, STATUS_SHORT[k]])])}</div>
      <div class="frow"><span class="lab">Function</span>${btns("fn", [["", "All"], ["TA", "TA"], ["Trustee", "Trustee"], ["RPS", "RPS"]])}</div>
      <div class="frow"><span class="lab">AFSG role</span>${btns("role", [["", "All"], ...ROLE_ORDER.map(r => [r, ROLE[r].l])])}</div>
      <div class="frow"><span class="lab">Narrow</span>${sel("fth", "Theme", D.themes.map(t => [t, t]), UCF.theme)} ${sel("fsrc", "Source", [["atlas", "Atlas products"], ["plan", "Initiatives and measures"], ["chain", "AFSG data chain"]], UCF.src)}
        <input type="search" id="fq" placeholder="Filter by word, domain or object" value="${esc(UCF.q)}" aria-label="Filter use cases"></div>
      <div class="frow"><span class="fsum" id="ucsum"></span><button class="xbtn" id="freset">Clear filters</button></div>
    </div>
    <div id="uclist"></div>
  </section>`;
}
function wireUseCases(focus) {
  const set = (k, v) => { UCF[k] = v; document.querySelectorAll(`.xbtn[data-k="${k}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v))); renderUcList(); };
  document.querySelectorAll(".xbtn[data-k]").forEach(b => b.onclick = () => set(b.dataset.k, b.dataset.v));
  document.querySelectorAll("#uctiles .tile").forEach(b => b.onclick = () => set("status", b.dataset.s));
  $("#fth").onchange = e => set("theme", e.target.value);
  $("#fsrc").onchange = e => set("src", e.target.value);
  $("#fq").oninput = e => { UCF.q = e.target.value.trim(); renderUcList(); };
  $("#freset").onclick = () => { Object.keys(UCF).forEach(k => UCF[k] = ""); route(); };
  renderUcList();
  if (focus) {
    const el = document.getElementById("uc-" + focus);
    if (el) { el.classList.add("hl"); setTimeout(() => el.scrollIntoView({ block: "center" }), 30); }
  }
}

function pageDomains() {
  const sec = (r, intro) => {
    const ds = domsBy(r);
    return `<section><div class="sec-h"><h2>${roleChip(r, { fill: r === "own" || r === "coown", big: 1 })}</h2><p>${esc(intro)}</p></div>
      <div class="grid g3">${ds.map(d => { const s = d.scope, info = d.info || {}; return `<a class="dt ${r}" style="--rc:var(--r-${r})" href="${dhref(d.n)}">
        <div class="hd"><div><span class="n">${d.n} · ${esc(d.code)}</span><h4>${esc(d.name)}</h4></div>${d.rq ? domRoleChip(d) : ""}</div>
        <div class="why">${esc(info.scope || info.stewards || info.close || "")}</div>
        <div class="why">${s.ownx ? `<b style="color:var(--ink)">${s.own} families owned, ${s.ownx} owned with carve-out</b> of ${s.fall}` : `<b style="color:var(--ink)">${s.fin} of ${s.fall}</b> families in AFSG scope`} · ${fmt(s.o)} objects · ${fmt(s.a)} attributes · ${fmt(s.c)} CDEs</div>
        ${info.owner ? `<div class="why">Candidate owner: <b style="color:var(--ink)">${esc(info.owner)}</b></div>` : ""}</a>`; }).join("")}</div></section>`;
  };
  return `<section class="hero" style="padding-bottom:0"><span class="eyebrow">Domains</span><h1>The domains AFSG would own, co-own or steward</h1>

    ${sec("own", "AFSG is the accountable data owner.")}${sec("coown", "AFSG co-owns defined families with the enterprise owner.")}${sec("steward", "Another function owns the domain; AFSG stewards the families its servicing creates.")}

    <div class="chips">${domsBy("close").map(d => domChip(d.n)).join("")}</div></section>`;
}

function famBlock(d, f, fi, open) {
  const full = !!(f.o[0] && f.o[0].a);
  let last = "";
  const objs = f.o.map((o, oi) => {
    let g = "";
    if (o.g && o.g !== last) { g = `<div class="og">${esc(o.g)}</div>`; }
    last = o.g || last;
    if (!full) return g + `<div class="xo" style="padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px"><b style="font-weight:600">${esc(o.n)}</b> <small class="muted">${plural(o.k, "attribute")}</small></div>`;
    const cde = o.a.filter(a => a[3]).length;
    return g + `<details class="xo" id="o-${f.code}-${oi}"><summary><b>${esc(o.n)}</b><small>${plural(o.a.length, "attribute")}${cde ? ` · ${cde} CDE` : ""}</small></summary>
      ${o.grain ? `<div class="grain">Grain: ${esc(o.grain)}</div>` : ""}
      <div class="tbl"><table><colgroup><col style="width:58%"><col style="width:24%"><col style="width:18%"></colgroup><thead><tr><th>Attribute and definition</th><th>Type</th><th>Flags</th></tr></thead><tbody>
      ${o.a.map((a, ai) => `<tr id="a-${f.code}-${oi}-${ai}"><td class="an"><b>${esc(a[0])}</b><span class="muted">${esc(a[1])}</span></td><td class="muted">${esc(a[2])}</td><td>${a[3] ? `<span class="badge cde">CDE</span> ` : ""}${a[4] ? `<span class="badge pii">PII</span>` : ""}</td></tr>`).join("")}
      </tbody></table></div></details>`;
  }).join("");
  const [no, na, nc] = f.k;
  return `<details class="xd ${f.role}" id="f-${f.code}"${open ? " open" : ""}><summary><span class="code">${esc(f.code)}</span><span class="nm">${esc(f.name)}</span>${froleChip(f.role)}${v2Badge(f)}
      <span class="cnt">${plural(no, "object")} · ${plural(na, "attribute")} · ${nc} CDEs</span>${f.note ? `<span class="fnote">${esc(f.note)}</span>` : ""}</summary>
      <div class="xbody"><p>${esc(f.def)}</p>${objs}</div></details>`;
}

function pageDomain(n, code, oi, ai) {
  const d = DOM[n];
  if (!d) return `<section class="hero"><h1>Domain not found</h1><p><a href="#/landscape">Back to the landscape</a></p></section>`;
  const info = d.info || {}, s = d.scope, ucs = (UC_BY_DOM[n] || []);
  const full = ["own", "coown"].includes(d.role), steward = d.role === "steward";
  const fams = d.f.slice().sort((a, b) => FROLE_ORDER.indexOf(a.role) - FROLE_ORDER.indexOf(b.role));
  const groups = FROLE_ORDER.map(r => [r, fams.filter(f => f.role === r)]).filter(x => x[1].length);
  const famsHtml = groups.map(([r, fs]) => `<div class="og" style="margin:16px 0 8px">${esc(FROLE[r].l)} · ${fs.length}</div><div style="display:grid;gap:8px">${fs.map(f => famBlock(d, f, d.f.indexOf(f), f.code === code)).join("")}</div>`).join("");
  const capBox = d.caps.length ? `<div class="box"><h3>Capabilities recorded here</h3><ul class="caps">${d.caps.map(c => `<li><b>${esc(c.name)}${c.v2 ? ` <span class="badge v2">New in v2</span>` : ""}${c.out ? ` <span class="badge pii">Outside AFSG</span>` : ""}</b><small>${esc(c.def)}</small></li>`).join("")}</ul></div>` : "";
  const qBox = info.questions ? `<div class="box"><h3>Open questions</h3><ul>${info.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>` : "";
  const atlas = (info.atlas || []).map(a => { const x = D.atlas.find(y => y[0] === a); return x ? `<span class="rc steward" style="--rc:var(--accent)">${esc(x[0])} · ${esc(x[1])}</span>` : ""; }).join(" ");
  const roleLine = d.role === "out" ? `<p class="dhead owner">Not in AFSG scope. Shown for reference: owned and used elsewhere in Capital Group.</p>` : "";
  const head = `<div class="dhead" style="--rc:var(--r-${d.role})">
    <div class="crumb"><a href="#/landscape">Landscape</a><span>›</span><a href="#/domains">Domains</a><span>›</span><span>${n}</span></div>
    <span class="num">${n} · ${esc(d.code)} · ${esc(AREA[d.area].name)}</span>
    <h1>${esc(d.name)}</h1>
    <div class="chips">${d.role === "out" ? `<span class="rc out big">${esc(ROLE.out.l)}</span>` : domRoleChip(d, { big: 1 })} ${atlas}</div>
    ${info.scope ? `<p class="scope">${esc(info.scope)}</p>` : ""}${info.stewards ? `<p class="scope"><b>AFSG stewards:</b> ${esc(info.stewards)}</p>` : ""}${info.close ? `<p class="scope"><b>AFSG depends on:</b> ${esc(info.close)}</p>` : ""}${roleLine}
    ${info.stays ? `<p class="owner">Stays with the enterprise owner: <b>${esc(info.stays)}</b></p>` : ""}
    ${info.owner ? `<p class="owner">Candidate owner (role): <b>${esc(info.owner)}</b></p>` : ""}
    ${info.why ? `<p class="owner">${esc(info.why)} ${n === "02" ? `References from the owned domains to 02: ${Object.entries(D.flows02).map(([k, v]) => `${k} → 02: <b>${v}</b>`).join(", ")}.` : ""}</p>` : ""}
    ${d.role !== "out" && d.role !== "close" ? `<div class="statrow">${s.ownx ? `<div><b>${s.own} + ${s.ownx}</b><span>families owned, ${s.ownx} with carve-out</span></div>` : `<div><b>${s.fin} of ${s.fall}</b><span>families in AFSG scope</span></div>`}<div><b>${fmt(s.o)}</b><span>objects in scope</span></div><div><b>${fmt(s.a)}</b><span>attributes in scope</span></div><div><b>${fmt(s.c)}</b><span>CDEs in scope</span></div><div><b>${ucs.length}</b><span>use cases land here</span></div></div>`
      : `<div class="statrow"><div><b>${d.f.length}</b><span>families</span></div><div><b>${fmt(d.f.reduce((t, f) => t + f.k[0], 0))}</b><span>objects</span></div><div><b>${fmt(d.f.reduce((t, f) => t + f.k[1], 0))}</b><span>attributes</span></div><div><b>${ucs.length}</b><span>use cases touch it</span></div></div>`}
  </div>`;
  const stewardBox = steward ? `<div class="box"><h3>Steward to name</h3><p>Decision 7: name the AFSG steward for this domain.</p></div>` : "";
  const top = [capBox, qBox || stewardBox].filter(Boolean);
  const side = top.length ? `<section><div class="cols c${top.length}">${top.join("")}</div></section>` : "";
  const ucSec = ucs.length ? `<section><div class="sec-h"><h2>Use cases that land here</h2><p>${plural(ucs.length, "AFSG use case")} with data in this domain. Open one to see all its homes.</p></div>
    <ul class="uclist two">${ucs.map(u => `<li><a href="#/usecases/${encodeURIComponent(u.id)}">${esc(u.title)}</a>${stBadge(u.status)}<small>${esc(D.sources[u.source])} · ${u.homes.filter(h => h[0] === n).map(h => esc(FAM[h[1]].f.name)).join(", ")}</small></li>`).join("")}</ul></section>` : "";
  return head + accountPanel(d) + side + `<section><div class="sec-h"><h2>Families</h2><p>${full || steward ? "Each family carries its proposed role. Open a family to see its objects, and an object to see its attributes with definition, type and CDE flag." : "Families and objects, for reference."}</p></div>${famsHtml}</section>` + ucSec;
}
/* 15 only: what "account" means, the institutional lifecycle, and the carve-out by Account Type */
function accountPanel(d) {
  const a = (d.info || {}).account;
  if (!a) return "";
  const dl = n => `<a class="mono" href="${dhref(n)}" title="${esc(DOM[n].name)}">${n}</a>`;
  const where = homes => homes.map(([n, c, objs]) => `<div>${dl(n)} <a href="${dhref(n, c)}">${esc(FAM[c].f.name)}</a>${objs.length ? ` <small class="muted">· ${objs.map(o => esc(o)).join(", ")}</small>` : ""}</div>`).join("");
  const senses = a.senses.map(([sense, what, homes]) => `<tr${homes[0][0] === d.n ? ` class="here"` : ""}><td data-l="When people say"><b>${esc(sense)}</b></td><td data-l="What it is" class="muted">${esc(what)}</td><td data-l="Where it lives"><div class="wh">${where(homes)}</div></td></tr>`).join("");
  const steps = a.lifecycle.map(([label, parts], i) => `${i ? `<span class="ar">→</span>` : ""}<span class="step${label === "Won" ? " won" : ""}${i === a.lifecycle.length - 1 ? " away" : ""}"><small>${esc(label)}</small>${parts.map(([t, n]) => `${dl(n)} ${esc(t)}`).join(" · ")}</span>`).join("");
  const carve = a.carveouts.map(([types, owner, dom, note]) => `<tr${owner === "AFSG" ? ` class="here"` : ""}><td data-l="Account type">${types.map(t => esc(t)).join("<br>")}</td><td data-l="Owns the rows">${owner === "AFSG" ? roleChip("own", { fill: 1, label: "AFSG" }) : `<b>${esc(owner)}</b>`}${dom ? ` <span class="muted" style="font-size:13px">(${dl(dom)} ${esc(DOM[dom].name)})</span>` : ""}</td><td data-l="Note" class="muted">${esc(note)}</td></tr>`).join("");
  return `<section><div class="sec-h"><h2>What “Account” means here</h2><p>Bare “account” in the reference is the client account in this domain. Other uses of the word live elsewhere and are always named in full.</p></div>
    <div class="acct">
      <div class="tbl"><table class="stack"><thead><tr><th style="width:22%">When people say</th><th style="width:38%">What it is</th><th>Where it lives</th></tr></thead><tbody>${senses}</tbody></table></div>
      <div><h3>An institutional client, from prospect to servicing</h3><p class="sub">The CRM account is the client; winning it creates records across several domains, one of them a row in this account master. Servicing it is outside AFSG.</p>
        <div class="flowline" style="margin-top:10px">${steps}</div></div>
      <div><h3>Who owns which rows, by account type</h3><p class="sub">One account master and one account key: AFSG owns the domain and carves rows out by account type to the functions that service them.</p>
        <div class="tbl" style="margin-top:10px"><table class="stack"><thead><tr><th style="width:30%">Account type</th><th style="width:38%">Owns the rows</th><th>Note</th></tr></thead><tbody>${carve}</tbody></table></div>
        <p class="sub" style="margin-top:10px">${esc(a.rules)}</p></div>
    </div></section>`;
}
function wireDomain(n, code, oi, ai) {
  if (!code) return;
  const f = document.getElementById("f-" + code);
  if (!f) return;
  f.open = true;
  let target = f;
  if (oi != null && oi !== "") {
    const o = document.getElementById(`o-${code}-${oi}`);
    if (o) { o.open = true; target = o; }
    if (ai != null && ai !== "") { const r = document.getElementById(`a-${code}-${oi}-${ai}`); if (r) { r.classList.add("hl"); target = r; } }
  }
  setTimeout(() => target.scrollIntoView({ block: target.tagName === "TR" ? "center" : "start" }), 30);
}

  ${D.gapsOpen.length ? `<section><div class="sec-h"><h2>Still open</h2><p>To add to the reference (decision 6). Each lists the use cases it leaves uncovered or partly covered.</p></div>
    <div class="grid g5">${D.gapsOpen.map(([id, t, miss, drv, prop, today]) => { const us = ucFor(id); const hn = D.gapHome[id]; return `<div class="box gcard ${D.gapHeld[id] ? "watch" : "open"}"><span class="gid">${esc(id)}</span><h3>${esc(t)}</h3>

      <div><span class="k">Proposed AFSG role once added</span>${hn ? `${roleChip(DOM[hn].role, { fill: DOM[hn].role === "own" })} <span class="muted" style="font-size:13px">${hn} ${esc(DOM[hn].name)}</span>` : `<span class="muted">Home to decide</span>`}</div>
      <div><span class="k">Closest families today</span>${today.map(([n, c]) => famLink(n, c)).join("; ")}</div>
      <div><span class="k">Use cases affected</span><ul class="uclist">${us.map(u => `<li><a href="#/usecases/${encodeURIComponent(u.id)}">${esc(u.title)}</a>${stBadge(u.status)}</li>`).join("")}</ul></div></div></div>`; }).join("")}</div></section>` : ""}
  <section><div class="sec-h"><h2>${D.gapsOpen.length ? "Partly covered use cases outside the named gaps" : "Partly covered use cases"}</h2><p>Where some of the data has a home and the rest does not${D.gapsOpen.length ? `, beyond ${OPEN_GAPS}` : ""}. Candidates to add to the gap list or to settle with the domain owner.</p></div>

    ${D.uc.filter(u => u.status === "partial" && !u.gap).map(u => `<tr><td data-l="Use case"><a href="#/usecases/${encodeURIComponent(u.id)}"><b>${esc(u.title)}</b></a><div class="src">${esc(D.sources[u.source])}</div></td><td data-l="What is missing">${esc((u.note.split("Missing:")[1] || u.note).trim())}</td><td data-l="Home today">${famLink(u.homes[0][0], u.homes[0][1])}</td></tr>`).join("")}
    </tbody></table></div></section>
  <section><div class="sec-h"><h2>Decisions for AFSG leadership</h2></div>

  <section><div class="sec-h"><h2>Atlas against the reference</h2><p>${esc(D.atlasNote)}</p></div>
    <div class="tbl"><table class="stack"><thead><tr><th style="width:22%">Atlas product</th><th>Content</th><th>Reference home</th><th style="width:30%">Families</th></tr></thead><tbody>
    ${D.atlas.map(([c, nm, ct, home, homes]) => `<tr><td data-l="Atlas product"><b>${esc(c)}</b><div class="muted" style="font-size:13px">${esc(nm)}</div></td><td data-l="Content">${esc(ct)}</td><td data-l="Reference home">${esc(home)}</td><td data-l="Families"><div class="chips">${homes.map(([n, cd]) => `<a class="dchip" style="--rc:var(--r-${FAM[cd].f.role === "out" ? (DOM[n].role === "close" ? "close" : "out") : FAM[cd].f.role});font-size:12.5px" href="${dhref(n, cd)}"><b>${n}</b>${esc(FAM[cd].f.name)}</a>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div></section>
  <section><div class="sec-h"><h2>Glossary</h2></div>
    <div class="tbl"><table class="stack"><thead><tr><th style="width:24%">Term</th><th>Meaning</th></tr></thead><tbody>${D.glossary.map(([t, m]) => `<tr><td data-l="Term"><b>${esc(t)}</b></td><td data-l="Meaning">${esc(m)}</td></tr>`).join("")}</tbody></table></div></section>`;
}

/* ---------- search over the AFSG scope ---------- */
const IDX = [];
D.doms.forEach(d => d.f.forEach(f => {
  if (!INSCOPE.includes(f.role)) return;
  IDX.push({ k: "Family", t: f.name, s: `${d.n} ${d.name} · ${f.code}`, h: dhref(d.n, f.code), q: (f.name + " " + f.code).toLowerCase() });
  f.o.forEach((o, oi) => {
    IDX.push({ k: "Object", t: o.n, s: `${d.n} · ${f.name}`, h: dhref(d.n, f.code, oi), q: o.n.toLowerCase() });
    (o.a || []).forEach((a, ai) => IDX.push({ k: "Attribute", t: a[0], s: `${o.n} · ${d.n} ${f.name}`, h: dhref(d.n, f.code, oi, ai), q: a[0].toLowerCase(), d: a[1] }));
  });
}));
let SEL = -1;
function search(q) {
  const box = $("#results");
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; return; }
  const ws = q.split(/\s+/);
  const rank = { Family: 0, Object: 1, Attribute: 2 };
  const hits = IDX.filter(x => ws.every(w => x.q.includes(w))).sort((a, b) => (a.q.startsWith(q) ? 0 : 1) - (b.q.startsWith(q) ? 0 : 1) || rank[a.k] - rank[b.k]).slice(0, 40);
  SEL = -1;
  box.innerHTML = hits.length ? hits.map((x, i) => `<button class="res" data-h="${esc(x.h)}" data-i="${i}"><span class="k">${x.k}</span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join("")
    : `<div class="res-empty">Nothing in AFSG scope matches “${esc(q)}”.</div>`;
  box.hidden = false;
  box.querySelectorAll(".res").forEach(b => b.onclick = () => go(b.dataset.h));
}
function go(h) { $("#results").hidden = true; $("#q").value = ""; if (location.hash === h) route(); else location.hash = h; }
$("#q").addEventListener("input", e => search(e.target.value));
$("#q").addEventListener("keydown", e => {
  const items = [...document.querySelectorAll("#results .res")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return; SEL = (SEL + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((b, i) => b.classList.toggle("on", i === SEL)); items[SEL].scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter" && items.length) go(items[Math.max(SEL, 0)].dataset.h);
  if (e.key === "Escape") { $("#results").hidden = true; }
});
document.addEventListener("click", e => { if (!$("#find").contains(e.target)) $("#results").hidden = true; });

/* ---------- theme ---------- */
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("afsg-theme", document.documentElement.dataset.theme); } catch (e) { }
};
try { const t = localStorage.getItem("afsg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { }

/* ---------- router ---------- */
function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(qs || "");
  const main = $("#main");
  let navKey = parts[0] || "";
  if (navKey === "domain") navKey = "domains";
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#/" + navKey ? "page" : "false"));
  let title = "AFSG Service Domains";
  if (!parts[0]) { main.innerHTML = pageOverview(); }
  else if (parts[0] === "landscape") {
    main.innerHTML = pageLandscape(); title = "Landscape · " + title;
    $("#landonly").onclick = e => { LAND_ONLY = !LAND_ONLY; e.target.setAttribute("aria-pressed", String(LAND_ONLY)); $("#land").classList.toggle("dim", LAND_ONLY); };
  }
  else if (parts[0] === "usecases") {
    if (params.get("status") !== null) { Object.keys(UCF).forEach(k => UCF[k] = ""); UCF.status = params.get("status"); }
    if (parts[1]) Object.keys(UCF).forEach(k => UCF[k] = "");
    main.innerHTML = pageUseCases(); wireUseCases(parts[1]); title = "Use cases · " + title;
  }
  else if (parts[0] === "domains") { main.innerHTML = pageDomains(); title = "Domains · " + title; }
  else if (parts[0] === "domain") { main.innerHTML = pageDomain(parts[1], parts[2], parts[3], parts[4]); wireDomain(parts[1], parts[2], parts[3], parts[4]); title = `${parts[1]} ${DOM[parts[1]] ? DOM[parts[1]].name : ""} · ${title}`; }
  else if (parts[0] === "gaps") { main.innerHTML = pageGaps(); title = "Gaps & decisions · " + title; }
  else if (parts[0] === "method") { main.innerHTML = pageMethod(); title = "Method · " + title; }
  else { main.innerHTML = pageOverview(); }
  document.title = title;
  if (!(parts[0] === "domain" && parts[2]) && !(parts[0] === "usecases" && parts[1])) window.scrollTo(0, 0);
}
$("#foot").innerHTML = `AFSG Service Domains · draft for discussion with AFSG leadership and prospective data domain owners · built ${esc(D.built)} from the reference data taxonomy (${D.ref.domains} domains, ${fmt(D.ref.families)} families, ${fmt(D.ref.attributes)} attributes). Not for distribution outside the program.`;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
