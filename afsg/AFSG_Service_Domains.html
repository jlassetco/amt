<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFSG Service Domains</title>
<style>
/* AFSG Service Domains: a client-specific reading of the reference data taxonomy. Sibling of the Taxonomy Explorer
   (same tokens and components); themed by brand.py. Self-contained: no fonts, scripts or images from the network. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --sunk: #edf0ee; --ink: #172128; --muted: #5d6a72; --line: #dce1df; --accent: #1f4e66; --accent-ink: #fff;
  --g-offer: #2c6e91; --g-reach: #6a4fa0; --g-sell: #a86f10; --g-result: #2d7d5a; --g-serve: #a0436a; --g-found: #56636d; --g-enterprise: #7a5a12;
  --ok: #2d7d5a; --warn: #9a5b00; --bad: #b42318; --cde: #a0436a;
  --shadow: 0 12px 32px rgba(23, 33, 40, .14);
  --f-display: Georgia, serif; --f-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 3vw, 40px); --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171b; --surface: #172127; --sunk: #1e2a31; --ink: #e5ebed; --muted: #97a6ad; --line: #2b3841; --accent: #7db8d2; --accent-ink: #10171b;
    --g-offer: #6fb0d2; --g-reach: #ab95dc; --g-sell: #deae55; --g-result: #6cc69b; --g-serve: #dd8db0; --g-found: #9cabb4; --g-enterprise: #d6b46a;
    --ok: #6cc69b; --warn: #f2b65a; --bad: #ff8a8f; --cde: #dd8db0;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171b; --surface: #172127; --sunk: #1e2a31; --ink: #e5ebed; --muted: #97a6ad; --line: #2b3841; --accent: #7db8d2; --accent-ink: #10171b;
  --g-offer: #6fb0d2; --g-reach: #ab95dc; --g-sell: #deae55; --g-result: #6cc69b; --g-serve: #dd8db0; --g-found: #9cabb4; --g-enterprise: #d6b46a;
  --ok: #6cc69b; --warn: #f2b65a; --bad: #ff8a8f; --cde: #dd8db0;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
}
:root {
  /* AFSG roles and coverage statuses, mapped onto the theme's series so the brand recolors them in both modes */
  --r-own: var(--g-offer); --r-ownx: var(--r-own); --r-coown: var(--g-reach); --r-steward: var(--g-serve); --r-close: var(--g-enterprise); --r-out: var(--g-found);
  --s-covered: var(--ok); --s-new: var(--ok); --s-partial: var(--warn); --s-gap: var(--bad);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
[hidden] { display: none !important; }

/* top bar (as the explorer) */
.bar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 10px 18px; padding: 12px var(--gutter); flex-wrap: wrap; max-width: 1440px; margin: 0 auto; }
.mark { display: grid; text-decoration: none; color: var(--ink); line-height: 1.15; }
.mark b { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.mark span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.find { margin-left: auto; position: relative; flex: 1 1 220px; max-width: 320px; min-width: 160px; }
.find input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px 8px 34px; }
.find::before { content: ""; position: absolute; left: 12px; top: 50%; width: 11px; height: 11px; border: 2px solid var(--muted); border-radius: 50%; transform: translateY(-62%); }
.find::after { content: ""; position: absolute; left: 22px; top: 58%; width: 6px; height: 2px; background: var(--muted); transform: rotate(45deg); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(560px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 50; }
.res { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
.res:hover, .res.on { background: var(--sunk); }
.res .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding-top: 2px; }
.res b { font-weight: 600; display: block; }
.res small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-empty { padding: 14px; color: var(--muted); }
.theme { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
@media (max-width: 1180px) { .find { order: 5; max-width: none; flex-basis: 100%; margin-left: 0; } }
@media (max-width: 560px) { .nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; } .nav a { font-size: 13.5px; padding: 6px 8px; } .mark b { font-size: 17px; } }

main { max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter) 80px; }
section { padding-block: 34px 6px; }
.sec-h { display: grid; gap: 6px; margin-bottom: 16px; max-width: 900px; }
.sec-h h2 { font-size: 27px; line-height: 1.15; }
.sec-h p { color: var(--muted); }
footer { max-width: 1440px; margin: 0 auto; padding: 18px var(--gutter) 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }

/* hero */
.hero { padding-block: 44px 6px; display: grid; gap: 14px; }
.hero h1 { font-size: clamp(30px, 4.2vw, 50px); line-height: 1.06; max-width: 1050px; }
.hero .lede { font-size: 18px; color: var(--muted); max-width: 900px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* role and status marks */
.rc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--rc); color: var(--rc); background: color-mix(in srgb, var(--rc) 9%, var(--surface)); text-decoration: none; }
.rc.f { background: var(--rc); color: var(--surface); }
.rc.own { --rc: var(--r-own); } .rc.ownx { --rc: var(--r-own); border-style: dashed; } .rc.coown { --rc: var(--r-coown); } .rc.steward { --rc: var(--r-steward); } .rc.close { --rc: var(--r-close); } .rc.out { --rc: var(--r-out); }
.rc.big { font-size: 13.5px; padding: 4px 12px; }
a.rc:hover { filter: brightness(1.08); text-decoration: underline; }
.dchip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14px; border-left: 4px solid var(--rc); }
.dchip b { font-family: var(--f-mono); font-size: 12px; color: var(--rc); font-weight: 600; white-space: nowrap; }
.dchip:hover { border-color: var(--rc); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 6px; white-space: nowrap; color: var(--sc); border: 1px solid color-mix(in srgb, var(--sc) 55%, var(--surface)); background: color-mix(in srgb, var(--sc) 9%, var(--surface)); }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sc); flex: none; }
.st.covered { --sc: var(--s-covered); } .st.new { --sc: var(--s-new); background: var(--sc); color: var(--surface); } .st.new::before { background: var(--surface); }
.st.partial { --sc: var(--s-partial); } .st.partial::before { background: linear-gradient(90deg, var(--sc) 50%, transparent 50%); border: 1px solid var(--sc); }
.st.gap { --sc: var(--s-gap); } .st.gap::before { background: transparent; border: 1.5px solid var(--sc); }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; vertical-align: 1px; }
.badge.cde { background: color-mix(in srgb, var(--cde) 15%, var(--surface)); color: var(--cde); }
.badge.pii { background: var(--sunk); color: var(--muted); }
.badge.v2 { background: var(--ok); color: var(--surface); }
.badge.v2w { box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }
.fnc { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--sunk); color: var(--ink); }
.src { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }

/* cards and boxes */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid.g5 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.box h3 { font-size: 19px; line-height: 1.2; }
.box p, .box li { color: var(--muted); font-size: 14px; }
.box.acc { border-top: 4px solid var(--rc, var(--accent)); }
.box ul, .box ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.qa .box { padding: 20px 22px; gap: 12px; }
.qa .q { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.25; }
.qa .a { color: var(--ink); font-size: 15.5px; }
@media (max-width: 860px) { .qa { grid-template-columns: minmax(0, 1fr); } }
.more { font-weight: 600; font-size: 14px; text-decoration: none; }
.more::after { content: " \2192"; }

/* coverage bar */
.cbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.cbar i { display: block; height: 100%; }
.cbar i.covered { background: color-mix(in srgb, var(--s-covered) 55%, var(--surface)); } .cbar i.new { background: var(--s-new); }
.cbar i.partial { background: var(--s-partial); } .cbar i.gap { background: var(--s-gap); }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.tile { padding: 12px 14px 4px 0; display: grid; gap: 2px; align-content: start; text-align: left; border: 0; background: none; color: inherit; }
.tile + .tile { padding-left: 14px; border-left: 1px solid var(--line); }
.tile b { font-family: var(--f-display); font-size: clamp(26px, 3vw, 38px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-weight: 600; font-size: 13.5px; }
.tile small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
button.tile:hover span { text-decoration: underline; }
button.tile[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 8%, transparent); }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile + .tile { padding-left: 0; border-left: 0; } .tile:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); } .tile { border-bottom: 1px solid var(--line); padding-bottom: 10px; } }

/* stat row */
.statrow { display: flex; flex-wrap: wrap; gap: 8px 0; margin-top: 6px; }
.statrow div { padding: 4px 20px 4px 0; margin-right: 20px; border-right: 1px solid var(--line); display: grid; }
.statrow div:last-child { border-right: 0; }
.statrow b { font-family: var(--f-display); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.statrow span { font-size: 12.5px; color: var(--muted); }

/* tables */
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td b { font-weight: 600; }
td .chips { gap: 4px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--ok); font-weight: 600; } .down { color: var(--muted); font-weight: 600; }
@media (max-width: 700px) {
  table.stack thead { display: none; }
  table.stack tr { display: grid; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  table.stack td { border: 0; padding: 0; }
  table.stack td[data-l]::before { content: attr(data-l); display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
}

/* landscape */
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 4px 0 14px; }
.xbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.xbtn:hover { color: var(--ink); }
.xbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.area { padding-top: 18px; border-top: 1px solid var(--line); margin-top: 18px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; }
.area h3 { font-size: 21px; }
.area p { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.area .meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; display: grid; gap: 2px; }
@media (max-width: 900px) { .area { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.dtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 10px; }
.dt { text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.dt:hover { border-color: var(--rc); box-shadow: var(--shadow); }
.dt.out { background: transparent; border-top-color: var(--line); }
.dt.out h4 { color: var(--muted); font-weight: 500; }
.dt .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dt .n { font-family: var(--f-mono); font-size: 12px; color: var(--rc); font-weight: 600; }
.dt h4 { font-size: 16.5px; line-height: 1.2; font-family: var(--f-body); }
.dt .why { font-size: 12.5px; color: var(--muted); }
.fams { display: flex; flex-wrap: wrap; gap: 4px; }
.fc { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.fc.own, .fc.ownx, .fc.coown, .fc.steward, .fc.close { border-color: var(--fr); color: var(--fr); background: color-mix(in srgb, var(--fr) 10%, var(--surface)); font-weight: 600; }
.fc.own { --fr: var(--r-own); } .fc.ownx { --fr: var(--r-own); border-style: dashed; background: linear-gradient(135deg, color-mix(in srgb, var(--fr) 16%, var(--surface)) 50%, var(--surface) 50%); } .fc.coown { --fr: var(--r-coown); } .fc.steward { --fr: var(--r-steward); } .fc.close { --fr: var(--r-close); background: transparent; border-style: dashed; }
.fc.v2::after { content: " new"; font-family: var(--f-body); font-weight: 700; text-transform: uppercase; font-size: 9px; color: var(--ok); }
.dim .dt.out { display: none; }

/* use cases */
.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.frow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.frow > .lab { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; min-width: 78px; }
.frow input[type=search], .frow select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.frow input[type=search] { flex: 1 1 240px; }
.fsum { font-size: 13px; color: var(--muted); }
.ucgroup { margin-top: 22px; }
.ucgroup > h3 { font-size: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); display: flex; gap: 10px; align-items: baseline; }
.ucgroup > h3 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.uchead, .uc { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.35fr) minmax(0, 1.55fr) 150px; gap: 16px; padding: 12px 4px; }
.uchead { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-block: 8px; border-bottom: 1px solid var(--line); }
.uc { border-bottom: 1px solid var(--line); }
.uc.hl { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-radius: 8px; }
.uc .t { font-weight: 600; font-size: 15px; line-height: 1.3; }
.uc .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 6px; }
.uc .note { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.uc .lab { display: none; }
.homes { display: grid; gap: 6px; font-size: 13.5px; }
.home a.hf { font-weight: 600; text-decoration: none; color: var(--ink); }
.home a.hf:hover { color: var(--accent); text-decoration: underline; }
.home .hd { font-size: 12px; color: var(--muted); }
.home .ho { color: var(--muted); font-size: 12.5px; display: block; }
.home + .home { padding-top: 6px; border-top: 1px dashed var(--line); }
.rolecell { display: grid; gap: 4px; justify-items: start; font-size: 12px; color: var(--muted); }
@media (max-width: 980px) {
  .uchead { display: none; }
  .uc { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px 4px; }
  .uc .lab { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .rolecell { grid-auto-flow: column; justify-content: start; align-items: center; gap: 8px; }
}

/* domain pages */
.dhead { padding-block: 34px 18px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumb a { color: var(--muted); }
.dhead .num { font-family: var(--f-mono); color: var(--rc); font-size: 14px; font-weight: 600; }
.dhead h1 { font-size: clamp(30px, 4vw, 46px); line-height: 1.06; }
.dhead .scope { font-size: 17px; max-width: 900px; }
.dhead .owner { color: var(--muted); }
.dhead .owner b { color: var(--ink); font-weight: 600; }
.xd { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--fr, var(--line)); border-radius: var(--radius); }
.xd.own { --fr: var(--r-own); } .xd.ownx { --fr: var(--r-own); border-left-style: dashed; } .xd.coown { --fr: var(--r-coown); } .xd.steward { --fr: var(--r-steward); } .xd.close { --fr: var(--r-close); }
.xd > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.xd > summary::-webkit-details-marker { display: none; }
.xd > summary::before { content: "\25B8"; font-size: 11px; color: var(--muted); width: 10px; transition: transform .12s; flex: none; }
.xd[open] > summary::before { transform: rotate(90deg); }
.xd .code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.xd .nm { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.xd .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.xd .fnote { flex-basis: 100%; padding-left: 20px; font-size: 13px; color: var(--muted); }
.xd.out .nm { color: var(--muted); }
.xbody { padding: 0 16px 14px 20px; display: grid; gap: 8px; }
.xbody > p { color: var(--muted); font-size: 13.5px; max-width: 900px; }
.og { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 6px; }
details.xo { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.xo > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
details.xo > summary::-webkit-details-marker { display: none; }
details.xo > summary::before { content: "+"; font-family: var(--f-mono); color: var(--muted); width: 10px; }
details.xo[open] > summary::before { content: "\2013"; }
details.xo > summary b { font-weight: 600; }
details.xo > summary small { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.xo .grain { font-size: 12.5px; color: var(--muted); padding: 0 12px 8px 32px; }
.xo .tbl { border-radius: 0 0 8px 8px; border: 0; border-top: 1px solid var(--line); }
.xo table { table-layout: fixed; min-width: 560px; font-size: 13px; }
.xo td { overflow-wrap: break-word; }
.xo td.an b { display: block; }
.xd, details.xo, .xo tr, .uc { scroll-margin-top: 96px; }
tr.hl td { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols.c1 { grid-template-columns: minmax(0, 1fr); }
.uclist.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
@media (max-width: 900px) { .uclist.two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.caps { list-style: none; padding: 0 !important; display: grid; gap: 8px !important; }
.caps li b { color: var(--ink); font-weight: 600; display: block; font-size: 14px; }
.caps li small { color: var(--muted); font-size: 12.5px; }
.uclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.box .uclist { padding-left: 0; }
.uclist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.uclist li a { color: var(--ink); text-decoration: none; font-weight: 500; }
.uclist li a:hover { color: var(--accent); text-decoration: underline; }
.uclist li small { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }

/* gaps and decisions */
.gcard { border-top: 4px solid var(--sc); }
.gcard.closed { --sc: var(--ok); } .gcard.open { --sc: var(--bad); } .gcard.watch { --sc: var(--warn); }
.gcard .gid { font-family: var(--f-mono); font-weight: 700; color: var(--sc); font-size: 14px; }
.kv { display: grid; gap: 8px; }
.kv .k { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kv div { font-size: 14px; }
.decs { list-style: none; margin: 0; padding: 0; counter-reset: d; display: grid; gap: 0; }
.decs li { counter-increment: d; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.decs li::before { content: counter(d); grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); font-size: 17px; }
.decs li b { font-size: 16px; font-weight: 600; }
.decs li p { color: var(--muted); font-size: 14px; }
.decs.compact li { padding: 9px 0; }
.decs.compact li::before { width: 28px; height: 28px; font-size: 14px; }
.flowline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flowline .step { font-weight: 600; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.flowline .ar { color: var(--muted); }
.flowline .step small { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.flowline .step.won { border-color: var(--r-own); }
.flowline .step.away { border-style: dashed; background: transparent; }
.acct { display: grid; gap: 26px; }
.acct h3 { font-size: 19px; }
.acct .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.acct tr.here td { background: color-mix(in srgb, var(--r-own) 7%, var(--surface)); }
.acct .wh { display: grid; gap: 3px; }
.acct .wh small { color: var(--muted); font-size: 12.5px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<style>
/* KPMG LLP theme for the client-facing explorer. Injected after the page's own <style> by brand.py.
   Not applied to review_app/, which is published separately on claude.ai.
   Palette and type taken from kpmg.com/us (2024 brand): KPMG Blue #1E49E2, Cobalt #0C233C,
   Purple #7213EA, Pink #FD349C, Pacific Blue #00B8F5, Light Blue #ACEAFF, Turquoise #63EBDA; Open Sans / Open Sans Condensed.
   Text-bearing tokens are darkened where the brand tint fails 4.5:1 on the page background.
   Component rules are scoped by <body data-app="..."> so they don't leak into pages that reuse class names (.bar, .btn) differently. */
:root {
  /* brand constants: same in both themes */
  --kpmg-blue: #1e49e2; --kpmg-cobalt: #0c233c; --kpmg-legacy-blue: #00338d;
  --kpmg-purple: #7213ea; --kpmg-pink: #fd349c; --kpmg-pacific: #00b8f5; --kpmg-light-blue: #aceaff; --kpmg-turquoise: #63ebda;

  --bg: #f5f6fa; --surface: #ffffff; --sunk: #eaedf3; --ink: #0c233c; --muted: #535e6c; --line: #d5d9e1;
  --accent: #1e49e2; --accent-ink: #ffffff; --accent-soft: #e3e9fc;
  /* categorical series (explorer value-chain groups) */
  --g-offer: #1e49e2; --g-reach: #7213ea; --g-sell: #c8166f; --g-result: #00796f; --g-serve: #0077a8; --g-found: #5b6676; --g-enterprise: #8a6400; --g-semantic: #d9480f;
  /* status */
  --cde: #c8166f; --cde-soft: #fde4f1;
  --ok: #00796f; --ok-soft: #d8f5f1; --warn: #9a5b00; --warn-soft: #fbeccf; --ask: #7213ea; --ask-soft: #ece1fd; --bad: #c0262d; --bad-soft: #fbe0e1;
  --shadow: 0 12px 32px rgba(12, 35, 60, .14);

  --f-display: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 4px;
  --logo: var(--kpmg-blue);
  color-scheme: light;
}

    --bg: #071627; --surface: #0c233c; --sunk: #12304f; --ink: #f5f6fa; --muted: #a7b3c4; --line: #21405f;
    --accent: #7f9cff; --accent-ink: #071627; --accent-soft: #1a3266;

    --cde: #ff7dbf; --cde-soft: #44193a;
    --ok: #63ebda; --ok-soft: #10393d; --warn: #f2b65a; --warn-soft: #3d2c12; --ask: #b78cff; --ask-soft: #2c1f52; --bad: #ff8a8f; --bad-soft: #43191e;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    --logo: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071627; --surface: #0c233c; --sunk: #12304f; --ink: #f5f6fa; --muted: #a7b3c4; --line: #21405f;
  --accent: #7f9cff; --accent-ink: #071627; --accent-soft: #1a3266;
  --g-offer: #7f9cff; --g-reach: #b78cff; --g-sell: #ff7dbf; --g-result: #63ebda; --g-serve: #4fd0ff; --g-found: #a7b3c4; --g-enterprise: #f1c75b; --g-semantic: #ffa15c;

  --ok: #63ebda; --ok-soft: #10393d; --warn: #f2b65a; --warn-soft: #3d2c12; --ask: #b78cff; --ask-soft: #2c1f52; --bad: #ff8a8f; --bad-soft: #43191e;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  --logo: #ffffff;
  color-scheme: dark;
}

/* shared: condensed bold headlines, as on kpmg.com */
h1, h2, h3, h4 { font-stretch: 75%; font-weight: 700; letter-spacing: 0; }

/* logo lockup: KPMG logo, a hairline, then the page title */
.kpmg-logo { display: block; height: 32px; width: auto; color: var(--logo); flex: none; align-self: center; }
.kpmg-logo + * { padding-left: 14px; border-left: 1px solid var(--line); }
@media (max-width: 560px) { .kpmg-logo { height: 26px; } }

/* explorer */
[data-app="explorer"] .bar { border-top: 4px solid var(--kpmg-blue); background: color-mix(in srgb, var(--surface) 92%, transparent); }
[data-app="explorer"] .bar-in { gap: 12px 18px; }
[data-app="explorer"] .bar-in .kpmg-logo { height: 28px; margin-right: -4px; }
[data-app="explorer"] .find { flex: 1 1 220px; max-width: 340px; }
[data-app="explorer"] .mark b, [data-app="explorer"] .rung b, [data-app="explorer"] .statrow b { font-stretch: 75%; font-weight: 700; }
[data-app="explorer"] .btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
[data-app="explorer"] .btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
[data-app="explorer"] .xbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
[data-app="explorer"] .gnum { background: var(--accent); color: var(--accent-ink); }
[data-app="explorer"] :is(.card, .box, .icard, .xd, .panel, .map-scroll, .mx, .lnav, .gtbl, .trace, .flowwrap, .lmwrap, .xpanel, details.con) { border-radius: var(--radius); }
[data-app="explorer"] .card::before { height: 4px; }
[data-app="explorer"] th { background: var(--sunk); color: var(--ink); letter-spacing: .06em; }
@media (max-width: 560px) { [data-app="explorer"] .mark span { display: none; } }

 Research","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"24","code":"PM","name":"Portfolio Management & Construction","area":"INV","role":"out","rq":null,"f":[{"code":"PM-GOV","name":"Investment Governance","def":"The investment committees that set house views, strategic allocations, glide paths and approved instrument types and that approve private investments: their remit and members, their meetings and the decisions taken at each meeting. Governance of data (21 Governance Decision, CD-) and fair value committees (22) are separate; the private deal itself is 30.","role":"out","v2":"","note":"","k":[4,34,7],"o":[{"n":"Investment Committee","k":13},{"n":"Investment Committee Member","k":5},{"n":"Investment Committee Meeting","k":6},{"n":"Investment Committee Decision","k":10}]},{"code":"PM-PMA","name":"Portfolio Management Assignment","def":"Which employees and investment teams manage each portfolio, in which operational role and over which period. The two may legitimately differ, for example for sleeve managers.","role":"out","v2":"","note":"","k":[1,10,5],"o":[{"n":"Portfolio Management Assignment","k":10}]},{"code":"PM-AAL","name":"Asset Allocation","def":"Strategic asset allocation policies by strategy, product or model portfolio, their asset-class lines, the glide paths of target-date series and the tactical views that tilt portfolios away from policy. Each is approved by an Investment Committee Decision, which is referenced, not restated.","role":"out","v2":"","note":"","k":[4,36,12],"o":[{"n":"Asset Allocation Policy","k":12},{"n":"Asset Allocation Policy Line","k":7},{"n":"Glide Path Point","k":8},{"n":"Tactical Allocation View","k":9}]},{"code":"PM-TGT","name":"Targets & Constraints","def":"What each portfolio and model should hold: versioned target allocation sets and their lines, the summary of a model change, the portfolio manager's own construction constraints and the commitment pacing plans of portfolios that invest in private funds. Mandate, client and account restrictions are referenced, never re-coded.","role":"out","v2":"","note":"","k":[5,53,16],"o":[{"n":"Target Allocation Set","k":15},{"n":"Target Allocation Line","k":12},{"n":"Model Change Summary","k":4},{"n":"Portfolio Construction Constraint","k":13},{"n":"Commitment Pacing Plan","k":9}]},{"code":"PM-DEC","name":"Investment Decisions","def":"Each investment decision about one or more portfolios or models: who took it, when, which action it calls for, which portfolios it covers and why. The decision is the start of the trail that trading (25 Trade Order), transaction reporting (MiFIR decision-maker field), compliance (33) and attribution (32) follow back.","role":"out","v2":"","note":"","k":[3,18,6],"o":[{"n":"Investment Decision","k":10},{"n":"Decision Rationale","k":5},{"n":"Investment Decision Scope","k":3}]},{"code":"PM-RBL","name":"Rebalancing & Trade Proposals","def":"How targets become trades: each rebalance run and what triggered it, its result for each portfolio, the proposed trades and lot selections it produces, and the tax budgets of tax-aware accounts. A released proposed trade becomes a 25 Trade Order, and the order references the proposal; 24 holds no order status beyond Released, no release details and no executed quantity.","role":"out","v2":"","note":"","k":[6,47,18],"o":[{"n":"Rebalance Run","k":10},{"n":"Rebalance Index Change Trigger","k":2},{"n":"Rebalance Portfolio Result","k":12},{"n":"Proposed Trade","k":11},{"n":"Proposed Lot Selection","k":4},{"n":"Tax Budget","k":8}]},{"code":"PM-CSH","name":"Cash Planning","def":"The portfolio manager's view of cash that can be invested: the investable cash forecast by value date and currency, built on the 18 cash projections, and the adjustments the manager adds for signals not yet in 18 and for planned decisions.","role":"out","v2":"","note":"","k":[2,19,5],"o":[{"n":"Investable Cash Forecast","k":10},{"n":"Cash Forecast Adjustment","k":9}]},{"code":"PM-ETF","name":"ETF Baskets","def":"The creation and redemption baskets of the firm's ETFs: which instruments and quantities make up a creation unit on a date, the estimated cash balancing amount, and the approval of custom baskets under SEC Rule 6c-11. 29 AP orders reference the basket and hold the actual cash per order; 06 keeps the primary-market flow; 01 keeps the creation unit size; 35 masters the daily holdings disclosure.","role":"out","v2":"","note":"","k":[3,23,12],"o":[{"n":"ETF Basket","k":12},{"n":"ETF Basket Constituent","k":6},{"n":"Custom Basket Approval","k":5}]}],"caps":[{"name":"Investment Policy & Asset Allocation","def":"Setting house views, strategic and tactical allocations and glide paths and recording investment committee decisions.","owner":"Chief Investment Officer","v2":false,"out":false},{"name":"Portfolio Construction & Rebalancing","def":"Setting portfolio targets against the mandate, forecasting investable cash and generating rebalancing trades.","owner":"Head of Portfolio Management","v2":false,"out":false},{"name":"Model Portfolio Management","def":"Maintaining the target allocations of model portfolios that drive SMA and model-delivery accounts.","owner":"Head of Portfolio Management","v2":false,"out":false},{"name":"Model Delivery to Sponsors","def":"Publishing model portfolio changes to sponsor platforms that trade the model for their own clients.","owner":"Head of Managed Accounts","v2":false,"out":false},{"name":"SMA Customization & Tax Management","def":"Applying client restrictions, tax-loss harvesting and transition plans to individual SMA accounts.","owner":"Head of Managed Accounts","v2":false,"out":false},{"name":"ETF Basket Construction","def":"Designing the daily creation and redemption baskets and portfolio composition file for each ETF.","owner":"Head of ETF Portfolio Management","v2":false,"out":false},{"name":"Portfolio Manager Assignment","def":"Recording which portfolio managers and teams run each portfolio, with effective dates.","owner":"Chief Investment Officer","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":8,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"25","code":"TR","name":"Trading & Execution","area":"INV","role":"out","rq":null,"f":[{"code":"TR-ORM","name":"Order Management","def":"Trade orders as created for each portfolio, the instructions that govern how they are worked, and the event trail from creation to completion. Fund orders from shareholders are 06 and 29; investment decisions and proposed trades are 24; compliance checks are 33.","role":"out","v2":"","note":"","k":[3,36,9],"o":[{"n":"Trade Order","k":25},{"n":"Order Handling Instruction","k":6},{"n":"Trade Order Event","k":5}]},{"code":"TR-EXE","name":"Execution","def":"How orders are aggregated and worked in the market: block orders and the orders they contain, placements with brokers, venues and algorithms, and the executions received back.","role":"out","v2":"","note":"","k":[4,37,18],"o":[{"n":"Block Order","k":9},{"n":"Block Order Membership","k":4},{"n":"Broker Placement","k":8},{"n":"Execution","k":16}]},{"code":"TR-ALC","name":"Allocation","def":"How the executed quantity is split across portfolios and SMA accounts, with the commission and fees charged and the MiFIR transaction reports where the firm reports, plus cross trades between client portfolios and trade errors. 18 books the allocations; 26 confirms and settles them.","role":"out","v2":"","note":"","k":[5,64,18],"o":[{"n":"Trade Allocation","k":18},{"n":"Allocation Cost Detail","k":9},{"n":"MiFIR Transaction Report","k":11},{"n":"Cross Trade","k":14},{"n":"Trade Error","k":12}]},{"code":"TR-NIS","name":"New Issues","def":"Participation in IPOs and other new issues: the offerings the firm takes part in, indications of interest, the allocations received and how they are shared, Rule 10f-3 purchases where an affiliate is in the syndicate, and the FINRA 5130 / 5131 eligibility of each portfolio or account.","role":"out","v2":"","note":"","k":[5,37,11],"o":[{"n":"New Issue Offering","k":9},{"n":"New Issue Indication","k":5},{"n":"New Issue Allocation","k":8},{"n":"Rule 10f-3 Purchase","k":7},{"n":"New Issue Eligibility Certification","k":8}]},{"code":"TR-CPA","name":"Counterparty Approval","def":"The approved broker and counterparty list: the trading role profile on each 02 party, what it is approved for and for which entities, funds and countries, the trading limits set, and the periodic reviews. Party facts are 02, trading agreements 26, exposure 31 and credit opinions 23.","role":"out","v2":"","note":"","k":[4,31,10],"o":[{"n":"Approved Counterparty Profile","k":6},{"n":"Counterparty Approval Scope","k":10},{"n":"Counterparty Trading Limit","k":8},{"n":"Counterparty Review","k":7}]},{"code":"TR-COM","name":"Commissions & Research Payments","def":"What brokers are paid and how research is paid for: commission schedules, commission sharing arrangements and their research credit balances, research budgets with the research payment account, and research payments to providers. The broker vote is 23; invoices and accounting are 19.","role":"out","v2":"","note":"","k":[5,36,9],"o":[{"n":"Commission Schedule","k":9},{"n":"Commission Sharing Arrangement","k":7},{"n":"Commission Sharing Balance","k":3},{"n":"Research Budget","k":7},{"n":"Research Payment","k":10}]},{"code":"TR-BEX","name":"Best Execution & TCA","def":"Evidence that the firm takes all sufficient steps to obtain the best possible result: the best execution policy by asset class and entity, transaction cost analysis results with their benchmark comparisons, broker execution reviews and best execution committee reviews. Surveillance is 38 and compliance checks 33.","role":"out","v2":"","note":"","k":[5,39,9],"o":[{"n":"Best Execution Policy","k":10},{"n":"TCA Result","k":10},{"n":"TCA Benchmark Result","k":4},{"n":"Broker Execution Review","k":6},{"n":"Best Execution Review","k" level settlement: the instruction sent to the custodian or agent for each allocation, collateral movement, repo leg, in-kind basket, FX trade, derivative payment or loan trade, every status advice and settlement confirmation received back, and the fails, buy-ins and penalties that follow when settlement does not happen on time. Statements of holdings and reconciliations to the custodian are 28.","role":"out","v2":"","note":"","k":[7,62,19],"o":[{"n":"Settlement Instruction","k":21},{"n":"Cash Payment Detail","k":5},{"n":"Loan Settlement Detail","k":6},{"n":"Settlement Status Event","k":8},{"n":"Settlement Fail","k":7},{"n":"Buy-In Notice","k":5},{"n":"Settlement Penalty","k":10}]},{"code":"TO-SSI","name":"Settlement Instructions & Cycles","def":"Standing settlement instructions for every client mandate, fund, portfolio and counterparty, with their independent verification, and the settlement cycle rules (T+1, T+2) and affirmation cut-offs per market and trade type.","role":"out","v2":"","note":"","k":[3,35,14],"o":[{"n":"Standing Settlement Instruction","k":21},{"n":"SSI Verification","k":5},{"n":"Settlement Cycle Rule","k":9}]},{"code":"TO-OTC","name":"OTC Derivative & Financing Lifecycle","def":"OTC derivative and repo trades after execution: the trade record that carries the UTI and the confirmed economics by leg, its lifecycle events, scheduled and realized cash flows and clearing, and the regulatory trade reports made for it. The product is 17 (UPI level) and the execution is 25.","role":"out","v2":"","note":"","k":[7,77,25],"o":[{"n":"OTC Derivative Trade","k":15},{"n":"Clearing Detail","k":5},{"n":"OTC Trade Leg","k":10},{"n":"OTC Lifecycle Event","k":7},{"n":"OTC Cash Flow","k":12},{"n":"Repo Trade","k":16},{"n":"Derivative Trade Report","k":12}]},{"code":"TO-AGR","name":"Trading Agreements","def":"The master agreements under which the funds trade OTC derivatives, repos, TBAs and cleared and listed derivatives (ISDA Master Agreement, Credit Support Annex for variation and initial margin, GMRA, MRA, MSFTA, futures clearing and give-up agreements), with their credit support terms, eligible collateral and termination event triggers. Counterparty approval and limits are 25.","role":"out","v2":"","note":"","k":[4,51,12],"o":[{"n":"Trading Agreement","k":16},{"n":"Credit Support Terms","k":17},{"n":"Eligible Collateral Schedule","k":10},{"n":"Termination Event Trigger","k":8}]},{"code":"TO-COL","name":"Margin & Collateral","def":"Daily collateral management under the trading agreements: margin calls issued and received and their disputes, the collateral movements that meet them, the collateral posted and received per portfolio and day (including repo collateral and cleared margin), and the regulatory initial margin calculation. Securities lending collateral is 28.","role":"out","v2":"","note":"","k":[5,54,18],"o":[{"n":"Margin Call","k":13},{"n":"Margin Call Dispute","k":5},{"n":"Collateral Movement","k":13},{"n":"Collateral Balance","k":15},{"n":"Initial Margin Calculation","k":8}]}],"caps":[{"name":"Trade Confirmation & Settlement","def":"Confirming, matching and settling trades and managing settlement fails and penalties.","owner":"Head of Trade Operations","v2":false,"out":false},{"name":"OTC Derivatives & Collateral Management","def":"Supporting the OTC derivative lifecycle and calling, posting and reconciling margin and collateral under ISDA and CSA terms.","owner":"Head of Trade Operations","v2":false,"out":false},{"name":"Standing Settlement Instruction Management","def":"Maintaining standing settlement instructions for funds, portfolios, client mandates and counterparties.","owner":"Head of Trade Operations","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"27","code":"FA","name":"Fund Accounting & Valuation","area":"FOP","role":"close","rq":null,"f":[{"code":"FA-FBK","name":"Fund Books & Ledgers","def":"The official books of each fund (ABOR Swing Pricing Parameter","k":8},{"n":"Swing Pricing Decision","k":10}]},{"code":"FA-EXP","name":"Fund Expenses","def":"What the fund budgets, accrues and pays for its own expenses, and how expense caps and waivers are applied. Cap and fee terms are 01; the adviser's revenue and waiver impact are 10; fund payables are kept here, not in 19.","role":"out","v2":"","note":"","k":[4,32,6],"o":[{"n":"Fund Expense Budget","k":5},{"n":"Fund Expense Accrual","k":9},{"n":"Expense Cap & Waiver Accrual","k":9},{"n":"Fund Expense Payment","k":9}]},{"code":"FA-INC","name":"Income & Distributions","def":"The distributions a fund declares, their tax character, and the estimates of distributable income behind them. Distribution policy and frequency are 01 terms; reinvestment transactions are 06; tax forms are 13; shareholder elections are 15.","role":"close","v2":"","note":"","k":[3,25,11],"o":[{"n":"Distribution Declaration","k":15},{"n":"Distribution Character","k":3},{"n":"Distributable Income Estimate","k":7}]},{"code":"FA-FTX","name":"Fund Tax","def":"The fund's tax year by jurisdiction and regime, its book-tax differences and the RIC asset and income tests. RIC qualification status and filings belong to 35; corporate tax is 19; partner-level allocations of private funds are 30. If a Tax domain is created, this family moves unchanged.","role":"out","v2":"","note":"","k":[3,25,9],"o":[{"n":"Fund Tax Year Record","k":12},{"n":"Book-Tax Difference","k":6},{"n":"RIC Test Result","k":7}]},{"code":"FA-COR","name":"NAV Errors & Corrections","def":"NAV errors found in a fund, their materiality under the applicable policy, how they were corrected at fund level and their impact on each share class and date. Shareholder remediation and accounts impacted are 13; correction transactions are 06; as-of orders are 29.","role":"close","v2":"","note":"","k":[2,27,9],"o":[{"n":"NAV Error Case","k":18},{"n":"NAV Error Impact","k":9}]},{"code":"FA-OVS","name":"NAV Controls & Fund Reporting","def":"N 7},{"n":"Fund Liquidity Profile","k":12},{"n":"Liquidity Horizon Bucket","k":7}]},{"code":"RK-DER","name":"Derivatives Risk","def":"The designated reference portfolio of each fund and the daily VaR tests under Rule 18f-4 and the UCITS VaR approaches. Both are keyed by the fund.","role":"out","v2":"","note":"","k":[2,17,8],"o":[{"n":"Designated Reference Portfolio","k":7},{"n":"VaR Test Result","k":10}]},{"code":"RK-LIM","name":"Risk Programs & Limits","def":"Which risk program governs each fund, the limits approved under a program or by the risk committee (RLMT-), their daily utilization, and every exceedance (RLEX-), including utilization and exceedances of 25 counterparty trading limits. Excludes portfolio manager constraints and budgets (24 Portfolio Construction Constraint), coded investment restrictions (33) and the counterparty trading limits themselves (25).","role":"out","v2":"","note":"","k":[4,56,14],"o":[{"n":"Risk Program Designation","k":8},{"n":"Risk Limit","k":25},{"n":"Risk Limit Utilization","k":8},{"n":"Risk Limit Exceedance","k":15}]},{"code":"RK-PRI","name":"Product Risk Indicators","def":"Calculation of the PRIIPs summary risk indicator and the UCITS SRRI per share class, and PRIIPs performance scenarios. 01 discloses the results as Derived copies; past performance is 32.","role":"out","v2":"","note":"","k":[2,22,6],"o":[{"n":"Product Risk Indicator Calculation","k":14},{"n":"PRIIPs Performance Scenario","k":8}]}],"caps":[{"name":"Portfolio Risk Measurement","def":"Measuring exposures, ex-ante risk, VaR, tracking error, stress scenarios and counterparty exposure for each portfolio and monitoring them against risk limits.","owner":"Head of Investment Risk","v2":false,"out":false},{"name":"Liquidity & Derivatives Risk","def":"Classifying portfolio liquidity and limiting derivatives risk under SEC Rules 22e-4 and 18f-4 and UCITS rules.","owner":"Liquidity Risk Management Program Administrator","v2":false,"out":false},{"name":"Product Risk Indicator Calculation","def":"Calculating the PRIIPs summary risk indicator, UCITS SRRI and PRIIPs performance scenarios that product documents disclose.","owner":"Head of Investment Risk","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":8,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"32","code":"PF","name":"Performance & Attribution","area":"IOP","role":"out","rq":null,"f":[{"code":"PF-SET","name":"Measurement Setup","def":"How returns are calculated: the firm's versioned performance calculation policy and, for every measured subject, an effective-dated measurement profile that applies the policy. Performance inception and track record source are 01 Performance Track Record and are not restated here.","role":"out","v2":"","note":"","k":[2,22,4],"o":[{"n":"Performance Calculation Policy","k":7},{"n":"Performance Measurement Profile","k":15}]},{"code":"PF-RAS","name":"Returns & Statistics","def":"The official returns of every measured subject, the components and hypothetical detail behind them, the benchmark returns they are compared with, and the ex-post statistics computed from realized returns. One Performance Return row is one number.","role":"out","v2":"","note":"","k":[5,72,27],"o":[{"n":"Performance Return","k":24},{"n":"Return Component Detail","k":11},{"n":"Hypothetical Performance Detail","k":3},{"n":"Benchmark Return","k":17},{"n":"Ex-Post Risk Statistic","k":17}]},{"code":"PF-GIP","name":"GIPS & Composites","def":"The firm's GIPS compliance record: the GIPS firm and its total assets, which portfolios sit in which composite and when, composite period statistics, significant cash flow removals, carve-outs and independent verifications. The composite definition, benchmark, minimum size and significant cash flow policy are 01 GIPS Composite.","role":"out","v2":"","note":"","k":[7,51,18],"o":[{"n":"GIPS Firm","k":7},{"n":"GIPS Firm Assets","k":3},{"n":"Composite Membership","k":9},{"n":"Composite Period Statistic","k":11},{"n":"Significant Cash Flow Event","k":9},{"n":"Carve-Out Allocation","k":5},{"n":"GIPS Verification","k":7}]},{"code":"PF-ATB","name":"Attribution","def":"Why a portfolio's return differed from its benchmark's: the versioned attribution models, the attribution results that apply them, results and effects by segment, and contribution to return by segment or instrument. 06 Attribution Record is sales crediting and unrelated.","role":"out","v2":"","note":"","k":[5,36,11],"o":[{"n":"Attribution Model","k":10},{"n":"Attribution Result","k":9},{"n":"Attribution Segment Result","k":6},{"n":"Attribution Effect","k":4},{"n":"Contribution to Return","k":7}]},{"code":"PF-PVM","name":"Private Markets Performance","def":"Since-inception money-weighted returns and multiples of private funds, private investments and private markets composites, investor-level measures and public market equivalents. Commitments, calls, distributions, capital accounts and waterfall calculations are 30.","role":"out","v2":"","note":"","k":[3,41,13],"o":[{"n":"Private Markets Performance Measure","k":22},{"n":"Investor Performance Measure","k":8},{"n":"Public Market Equivalent","k":11}]},{"code":"PF-GOV","name":"Performance Governance","def":"Controls that make performance official: the period close that releases final returns for a group of subjects, and the restatement record that links a superseded version of a return to the version that corrects it.","role":"out","v2":"","note":"","k":[2,18,7],"o":[{"n":"Performance Period Close","k":6},{"n":"Performance Restatement","k":12}]}],"caps":[{"name":"Performance Measurement","def":"Calculating portfolio, share class, account, composite and benchmark returns and maintaining GIPS composite membership.","owner":"Head of Performance Measurement","v2":false,"out":false},{"name":"Performance Attribution & Analytics","def":"Explaining returns by allocation, selection, currency and factor and producing risk-adjusted statistics.","owner":"Head of Performance Measurement","v2":false,"out":false},{"name":"Private Markets Performance","def":"Calculating IRRs, multiples and public market equivalents for private funds, their investments and their investors.","owner":"Head of Performance Measurement","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"33","code":"IC","name":"Investment Compliance","area":"IOP","role":"out","rq":null,"f":[{"code":"IC-LIB","name":"Rule Library","def":"The coded rule base: the statutory limit parameters rules are built from (33 is the master of statutory limits), the named rule libraries and the dated sets of rule versions that make up each library version, the compliance rules themselves with their logic, limits, warning levels and effective-dated versions, and the links from each rule version to the restriction, provision or policy it implements. Restriction text and limit values as written stay in 01 and 02.","role":"out","v2":"","note":"","k":[5,57,23],"o":[{"n":"Regulatory Limit Provision","k":11},{"n":"Rule Library","k":8},{"n":"Rule Library Membership","k":4},{"n":"Compliance Rule","k":26},{"n":"Rule Source Link","k":8}]},{"code":"IC-COD","name":"Rule Coding & Assignment","def":"How rules reach portfolios and data: assignments of a pinned library version or rule version to portfolios, the instrument and issuer lists that membership rules read, the requests through which restrictions are interpreted and coded, and the coding status of each 01 and 02 restriction.","role":"out","v2":"","note":"","k":[5,44,6],"o":[{"n":"Rule Assignment","k":9},{"n":"Rule Instrument List","k":11},{"n":"Rule Instrument List Member","k":7},{"n":"Rule Coding Request","k":11},{"n":"Restriction Coding Status","k":6}]},{"code":"IC-CHK","name":"Checks & Results","def":"Every test the engine runs: pre-trade checks of proposed trades, orders, blocks and deals, intraday and post-trade batch checks of portfolios, and what-if checks, with the outcome per tested order (one row per member order when a block is checked) and the result of each rule version for each portfolio and evaluated issuer or group. Order status stays in 25.","role":"out","v2":"","note":"","k":[4,33,17],"o":[{"n":"Compliance Check Run","k":7},{"n":"Pre-Trade Check Subject","k":5},{"n":"Check Subject Member","k":7},{"n":"Compliance Rule Result","k":14}]},{"code":"IC-ALT","name":"Alerts & Overrides","def":"Alerts raised from failing, warning and unevaluated rule results, how each is worked and disposed of, and the approvals that allow an order to be released despite a hard failure.","role":"out","v2":"","note":"","k":[3,23,6],"o":[{"n":"Compliance Alert","k":6},{"n":"Alert Disposition","k":8},{"n":"Pre-Trade Override Approval","k":9}]},{"code":"IC-BRC","name":"Breaches & Remediation","def":"Investment breaches of coded rules from detection to closure: what was breached, for which issuer or group, when and why, the restrictions behind the breached rule, how it was cured, the loss to the portfolio where it is not already on a 25 Trade Error or 27 NAV Error Case, and the review and sign-off. Client notification is 12's; board reporting and regulator notification are 35's; exceedances of 31 risk limits are 31's.","role":"out","v2":"","note":"","k":[5,52,16],"o":[{"n":"Investment Breach","k":23},{"n":"Breached Source Restriction","k":3},{"n":"Breach Remediation Action","k":8},{"n":"Breach Loss Calculation","k":8},{"n":"Breach Review","k":10}]},{"code":"IC-OVS","name":"Waivers & Program Oversight","def":"Evidence of the compliance program around the rules: client or board approved exceptions to a rule for a portfolio with the relaxed limit held as data, periodic reviews of rules and libraries under Rule 38a-1, and manual checks of restrictions the engine cannot test.","role":"out","v2":"","note":"","k":[3,31,6],"o":[{"n":"Guideline Waiver","k":14},{"n":"Periodic Rule Review","k":8},{"n":"Manual Compliance Check","k":9}]}],"caps":[{"name":"Investment Guideline Coding","def":"Translating prospectus, mandate, client and regulatory restrictions into coded compliance rules.","owner":"Head of Investment Compliance","v2":false,"out":false},{"name":"Pre- & Post-Trade Compliance Monitoring","def":"Testing orders and holdings against coded rules and managing the alerts they raise.","owner":"Head of Investment Compliance","v2":false,"out":false},{"name":"Investment Breach Management","def":"Investigating, remediating and reporting breaches of investment guidelines and regulatory limits.","owner":"Head of Investment Compliance","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"34","code":"ST","name":"Stewardship & Sustainable Investing","area":"INV","role":"out","rq":null,"f":[{"code":"ST-POL","name":"Stewardship Policies","def":"The rules the firm votes by and who may vote: voting policies and their guidelines by issue category and market, and for each portfolio or SMA account the effective-dated arrangement that says who holds voting authority and which policy applies. Board approval of a voting policy is held once, on 35 Resolution Subject Link.","role":"out","v2":"","note":"","k":[3,28,4],"o":[{"n":"Voting Policy","k":11},{"n":"Voting Guideline","k":7},{"n":"Voting Authority Arrangement","k":10}]},{"code":"ST-VTG","name":"Investee Meetings & Votes","def":"How the firm votes at meetings of the companies and funds its portfolios hold: the agenda items of each meeting (a 17 corporate action event), proxy advisor recommendations, one ballot per meeting and safekeeping account, the firm's vote decision and rationale on each item, the vote instructed on each ballot, and decisions to recall lent shares so they can be voted. A meeting of one of the firm's own funds is a 13 Proxy Campaign; 34 records a ballot only where an own portfolio holds that fund.","role":"out","v2":"","note":"","k":[6,50,18],"o":[{"n":"Investee Meeting Agenda Item","k":7},{"n":"Proxy Advisor Recommendation","k":6},{"n":"Ballot","k":11},{"n":"Vote Rationale","k":7},{"n":"Vote Instruction","k":13},{"n":"Lending Recall Decision","k":6}]},{"code":"ST-ENG","name":"Engagement","def":"Engagement with investee companies, issuers, private portfolio companies and market participants as a case with an objective: its objectives and milestones, the interactions held (referencing 23 issuer meetings rather than repeating them), escalation steps, and the collaborative initiatives the firm belongs to.","role":"out","v2":"","note":"","k":[5,38,6],"o":[{"n":"Engagement","k":11},{"n":"Engagement Objective","k":6},{"n":"Engagement Interaction","k":9},{"n":"Escalation Action","k":7},{"n":"Collaborative Initiative Membership","k":5}]},{"code":"ST-ESG","name":"ESG Data & Assessments","def":"Sustainability data about issuers and instruments as observed from vendors and company reports, and the firm's own view: indicator definitions at issuer, portfolio and entity level, issuer sustainability and ESG rating observations, firm ESG assessments, sustainable investment determinations and sustainability exclusion lists.","role":"out","v2":"","note":"","k":[7,65,27],"o":[{"n":"Sustainability Indicator Definition","k":10},{"n":"Issuer Sustainability Observation","k":10},{"n":"ESG Rating Observation","k":6},{"n":"Firm ESG Assessment","k":13},{"n":"Sustainable Investment Determination","k":10},{"n":"Sustainability Exclusion List","k":8},{"n":"Exclusion List Member","k":8}]},{"code":"ST-PAI","name":"Portfolio Sustainability Metrics & Product Outcomes","def":"Portfolio, product and entity sustainability metrics held once in one vocabulary (financed emissions, carbon footprint, WACI, PAI indicators, implied temperature rise) and tagged with the frameworks they are reported under; SFDR principal adverse impact statements that select them; and the sustainability outcomes each product achieved in a reference period, measured against the commitments held in 01.","role":"out","v2":"","note":"","k":[3,40,17],"o":[{"n":"PAI Calculation","k":9},{"n":"Portfolio Sustainability Metric","k":18},{"n":"Product Sustainability Outcome","k":13}]},{"code":"ST-CLI","name":"Financed Emissions & Climate Targets","def":"The holding-level attribution behind financed emissions metrics, and the climate targets the firm sets with their baselines and progress.","role":"out","v2":"","note":"","k":[2,25,8],"o":[{"n":"Financed Emissions Holding Detail","k":10},{"n":"Climate Target","k":15}]},{"code":"ST-DSC","name":"Stewardship Disclosure & Reporting","def":"The stewardship content the firm discloses: proxy voting reports (Form N-PX fund and manager reports, SRD II voting disclosures, SMA client voting reports) and stewardship reports (UK Stewardship Code, PRI, FCA ESG sourcebook, SRD II engagement policy), the signatory status granted on them and the engagements each report features. Filing is 35's (its filing document rows reference the reports); client presentation is 12's.","role":"out","v2":"","note":"","k":[4,31,10],"o":[{"n":"Proxy Voting Report","k":11},{"n":"Stewardship Report","k":10},{"n":"Signatory Status","k":6},{"n":"Reported Engagement","k":4}]}],"caps":[{"name":"ESG Data & Sustainability Reporting","def":"Sourcing and scoring ESG data on issuers and holdings and producing stewardship, climate and SFDR principal adverse impact disclosures.","owner":"Head of Sustainable Investing","v2":false,"out":false},{"name":"Proxy Voting & Engagement","def":"Voting proxies on securities held and engaging with investee companies, as a shareholder of those companies.","owner":"Head of Stewardship","v2":false,"out":false}],"info":{},"scope":{"fin":0,"fall":7,"o":0,"a":0,"c":0,"own":0,"ownx":0,"coown":0,"steward":0}},{"n":"35","code":"FG","name":"Fund Governance & Regulatory Reporting","area":"FOP","role":"close","rq":null,"f":[{"code":"FG-GOV","name":"Governing Bodies","def":"The bodies that govern the firm's funds as legal persons, the funds each covers, who sits on them and in what capa
