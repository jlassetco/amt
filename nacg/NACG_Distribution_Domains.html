iness."},{"name":"Product Changes & Corporate Events","def":"Managing share class additions, fee changes, mergers, conversions and liquidations of products."},{"name":"Product Governance Reviews","def":"Running periodic product reviews, including Consumer Duty value assessments and UK assessments of value."}],"info":{"stewards":"Product proposals NACG sponsors with their market evidence; distribution readiness checks at launch."},"scope":{"fin":2,"fall":5,"o":6,"a":70,"c":10,"own":0,"coown":0,"steward":2,"close":3,"out":0}},{"n":"37","code":"ER","name":"Enterprise & Operational Risk","area":"CORP","role":"out","afsg":"steward","rq":null,"f":[{"code":"ER-RFW","name":"Risk Framework & Register","def":"The firm's non-financial risk taxonomy, the enterprise risk register, the dated assessments of each risk and the appetite the boards have set. Investment risk measurement (exposures, VaR, liquidity) is 31; this family holds non-financial risk, plus the capital and liquidity appetite statements 43 measures against.","role":"out","afsg":"","note":"","k":[4,34,9],"o":[{"n":"Risk Taxonomy Category","k":5},{"n":"Enterprise Risk","k":8},{"n":"Risk Assessment","k":13},{"n":"Risk Appetite Statement","k":8}]},{"code":"ER-CSA","name":"Risk & Control Self-Assessment","def":"The control library and the work that keeps it honest: RCSA campaigns, the links between risks and the controls that mitigate them, and tests of those controls by the first line, compliance monitoring and risk. Control executions stay in the domains that perform them; audit testing stays in the audit engagement.","role":"out","afsg":"steward","note":"","k":[4,32,7],"o":[{"n":"RCSA Campaign","k":5},{"n":"Control","k":14},{"n":"Risk Control Link","k":5},{"n":"Control Test","k":8}]},{"code":"ER-INL","name":"Operational Incidents & Losses","def":"Operational incidents (the business-impact record of an operational failure), the records that revealed them, their classification and regulatory notification, and the loss events and amounts that follow. Investment breaches (33) and risk limit exceedances (31) are incidents only when an operational failure caused them or they caused a loss; technical incident records stay in 41 and 44. Insurance recoveries are read from 43 Insurance Claim, which references the loss event.","role":"out","afsg":"steward","note":"","k":[6,64,20],"o":[{"n":"Operational Incident","k":15},{"n":"Incident Source Record","k":16},{"n":"Incident Classification","k":8},{"n":"Incident Regulatory Notification","k":7},{"n":"Operational Loss Event","k":8},{"n":"Loss Event Amount","k":10}]},{"code":"ER-KRI","name":"Key Risk Indicators","def":"Indicators that measure risks and appetite, their thresholds and their observed values. A KRI may be defined on a 21 metric definition, whose definition and direction it then copies; the observed value is mastered here.","role":"out","afsg":"steward","note":"","k":[3,14,8],"o":[{"n":"Key Risk Indicator","k":6},{"n":"KRI Threshold","k":4},{"n":"KRI Observation","k":4}]},{"code":"ER-ISS","name":"Issues & Actions","def":"The one remediation register: issues from every source (self-identified, control tests, incidents, model validations, audit findings, 38 examination findings and program reviews, third-party assessments, resilience tests, 41 vulnerability findings) and the actions that close them, including risk acceptances. The link from an issue to its source is held once, here (program lead ruling 4).","role":"out","afsg":"steward","note":"","k":[2,26,6],"o":[{"n":"Risk Issue","k":17},{"n":"Issue Action","k":9}]},{"code":"ER-RES","name":"Operational Resilience & Continuity","def":"FCA SYSC 15A important business services and impact tolerances, DORA critical or important functions, the resources they depend on, business impact analyses, business continuity plans and resilience tests. ICT continuity and disaster recovery plans and technical test results are 41's; the DORA register of information and outsourcing arrangements are 40's.","role":"out","afsg":"steward","note":"","k":[7,51,13],"o":[{"n":"Important Business Service","k":8},{"n":"Impact Tolerance","k":5},{"n":"Critical or Important Function","k":6},{"n":"Resilience Resource Mapping","k":12},{"n":"Business Impact Analysis","k":5},{"n":"Business Continuity Plan","k":7},{"n":"Resilience Test","k":8}]},{"code":"ER-TPR","name":"Third-Party Risk","def":"The enterprise third-party risk register: the residual risk of each third party per 40 supplier engagement and assessment cycle, by risk domain. The inherent criticality tier, exit plans, the outsourcing register and the DORA register of information are 40's; data-vendor and custody specializations stay in 14 and 28 and hold the reference to this assessment.","role":"out","afsg":"steward","note":"","k":[2,13,5],"o":[{"n":"Third-Party Risk Assessment","k":9},{"n":"Third-Party Risk Domain Result","k":4}]},{"code":"ER-MRM","name":"Model Risk Management","def":"The firm's model inventory and its governance: each model and version, its tier, its independent validations and its ongoing performance monitoring. Model vendor, owner, governance status and version are mastered here; the models as used (factors, methods, parameters) stay in 31, 32, 23, 22 and 34, and AI use cases and AI risk classification stay in 21.","role":"out","afsg":"","note":"","k":[4,29,9],"o":[{"n":"Model Inventory Entry","k":9},{"n":"Model Tier Assignment","k":7},{"n":"Model Validation","k":8},{"n":"Model Performance Monitoring","k":5}]},{"code":"ER-AUD","name":"Internal Audit","def":"The third line's record: the audit universe, the annual audit plan, engagements, findings and the validations that close them. Owned by the Chief Audit Executive, distinct from the risk-owned families, so its independence rests on ownership. Audit committee approval of the plan is linked from 39 Corporate Resolution Subject Link.","role":"out","afsg":"","note":"","k":[5,34,12],"o":[{"n":"Auditable Entity","k":10},{"n":"Audit Plan","k":4},{"n":"Audit Engagement","k":8},{"n":"Audit Finding","k":7},{"n":"Finding Closure Validation","k":5}]}],"caps":[{"name":"Risk & Control Assessment","def":"Maintaining the risk taxonomy, register and appetite, assessing risks and controls through self-assessment and tracking key risk indicators."},{"name":"Incident & Loss Event Management","def":"Recording operational incidents, their regulatory notifications and losses and tracking the resulting issues and actions."},{"name":"Operational Resilience & Business Continuity","def":"Mapping important business services and planning and testing recovery from disruption."},{"name":"Model Risk Management","def":"Keeping the model inventory and validating, tiering and monitoring models used across the firm."},{"name":"Internal Audit","def":"Planning and performing independent audits of the firm's activities and tracking findings to closure."},{"name":"Third-Party Risk Assessment","def":"Assessing the residual risk of suppliers and outsourced providers by risk domain and tracking the issues it raises."}],"info":{},"scope":{"fin":0,"fall":9,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":0,"out":9}},{"n":"38","code":"CO","name":"Corporate Compliance & Regulatory Affairs","area":"CORP","role":"close","afsg":"steward","rq":null,"f":[{"code":"CO-REG","name":"Registrations & Firm Filings","def":"Registrations, licenses and passports held by each internal legal entity, the firm-level regulatory filings made for them (Form ADV, Form BD, 13F, 13D / 13G, 13H, Form SHO, EU and UK major holdings and short position notifications, CASS CMAR), and the ownership disclosure determinations that decide whether a holdings filing is due. It includes the firm's registered transfer agent: its Form TA-1 registration, Form TA-2 annual reports, Rule 17Ad-13 internal control reports and any Form TA-W, and the IRS nonbank trustee approval of a firm entity. It also includes the firm's role as underwriter of 529 savings plans and ABLE programs: its MSRB registration and Form G-45 reports. Fund filings are 35; distribution filings are 08.","role":"out","afsg":"steward","note":"","k":[4,38,19],"o":[{"n":"Entity Authorization","k":12},{"n":"Cross-Border Passport","k":6},{"n":"Firm Regulatory Filing","k":10},{"n":"Ownership Disclosure Determination","k":10}]},{"code":"CO-RCH","name":"Regulatory Obligations & Change","def":"The register of regulatory obligations of every regulated entity, moved from 08 and widened to all regimes, and the inventory of regulatory change: new and amended rules, guidance and consultations, and their assessed impact on entities, business lines and Data Domains.","role":"close","afsg":"","note":"Regulatory change affecting distribution.","k":[3,25,5],"o":[{"n":"Regulatory Obligation","k":10},{"n":"Regulatory Change Item","k":7},{"n":"Regulatory Change Impact","k":8}]},{"code":"CO-EXM","name":"Examinations & Inquiries","def":"Regulatory examinations, sweeps, thematic reviews and informal inquiries of the firm's regulated entities, the regulator's document and information requests, and the findings raised. Formal investigations, subpoenas, Wells notices and enforcement are 39 Legal Matters; remediation of findings is a 37 Risk Issue.","role":"out","afsg":"steward","note":"","k":[3,20,9],"o":[{"n":"Regulatory Examination","k":8},{"n":"Regulator Request Item","k":6},{"n":"Examination Finding","k":6}]},{"code":"CO-POL","name":"Policies & Attestations","def":"The library of every firm policy as a governed document with its versions, the attestations people give against policies and certifications, and the annual review of the compliance program. Domain policy objects (22, 24, 25, 32, 34, 44) keep their parameters and reference the governing policy here; IT and information security policies are rows here referenced by 41.","role":"out","afsg":"","note":"","k":[4,31,9],"o":[{"n":"Policy","k":8},{"n":"Policy Version","k":8},{"n":"Attestation","k":7},{"n":"Compliance Program Review","k":8}]},{"code":"CO-COE","name":"Code of Ethics & Personal Trading","def":"Who is covered by the code of ethics and in what capacity, the brokerage accounts they and their households hold, their initial, annual and quarterly reports, personal transactions, pre-clearance requests and code of ethics violations (Advisers Act Rule 204A-1, Investment Company Act Rule 17j-1, MiFID II Delegated Regulation Article 29, FCA COBS 11.7). HR sanctions stay 20.","role":"out","afsg":"","note":"","k":[7,53,9],"o":[{"n":"Conduct Population Designation","k":6},{"n":"Personal Trading Account","k":9},{"n":"Personal Securities Report","k":6},{"n":"Reported Personal Holding","k":5},{"n":"Personal Transaction","k":10},{"n":"Pre-Clearance Request","k":9},{"n":"Code of Ethics Violation","k":8}]},{"code":"CO-PAY","name":"Political Contributions","def":"Political contributions by the firm and its covered associates, their pre-clearance and the pay-to-play review under Advisers Act Rule 206(4)-5 and similar state and MSRB rules. Lobbying registrations and reports are 42; an LD-203 report references these records and copies no amount.","role":"close","afsg":"","note":"Political contributions and pay-to-play reviews.","k":[2,16,4],"o":[{"n":"Political Contribution","k":10},{"n":"Pay-to-Play Review","k":6}]},{"code":"CO-CNF","name":"Conflicts of Interest","def":"The firm conflicts of interest register (FCA SYSC 10, MiFID II Delegated Regulation Articles 33-35, UCITS and AIFMD conflicts rules, Form ADV Part 2A disclosures), the controls, disclosures and consents that mitigate each conflict, and outside business activities of employees. 08 Distribution Conflict of Interest (COI-) is the distribution profile of a register entry here.","role":"out","afsg":"","note":"","k":[3,21,4],"o":[{"n":"Conflict of Interest","k":6},{"n":"Conflict Mitigation","k":7},{"n":"Outside Business Activity","k":8}]},{"code":"CO-AML","name":"AML & Sanctions Program","def":"The anti-money laundering and sanctions program of each covered entity (funds under 31 CFR 1024.210, the broker-dealer under 1023.210, the adviser once the FinCEN investment adviser rule applies, UK and EU firms under the Money Laundering Regulations and AMLD), AML and sanctions cases escalated from 02, 29, 40 and 38 alerts, and the confidential reports filed. Client KYC is 02 and shareholder-account monitoring 29.","role":"out","afsg":"steward","note":"","k":[3,29,12],"o":[{"n":"AML Program Assessment","k":8},{"n":"AML Case","k":14},{"n":"AML and Sanctions Report","k":7}]},{"code":"CO-MKT","name":"Market Conduct & Information Barriers","def":"The firm restricted, watch and insider lists and their entries, MNPI escalations and wall-crossings with insider list entries (EU / UK MAR Article 18), and surveillance of orders, executions and personal transactions for market abuse, with suspicious transaction and order reports (MAR Article 16). 33 rules read the restricted list; communications surveillance stays in 08.","role":"out","afsg":"","note":"","k":[6,47,16],"o":[{"n":"Firm Restricted List","k":5},{"n":"Restricted List Entry","k":9},{"n":"MNPI Escalation","k":11},{"n":"Insider List Entry","k":8},{"n":"Trade Surveillance Alert","k":9},{"n":"Suspicious Transaction and Order Report","k":5}]}],"caps":[{"name":"Regulatory Registrations, Exams & Change","def":"Maintaining firm registrations, entity authorizations, firm filings and the regulatory obligations register, managing regulatory exams and inquiries and tracking regulatory change."},{"name":"Code of Ethics & Conflicts","def":"Administering personal trading, political contribution, outside activity and conflict of interest rules for employees and the firm."},{"name":"AML & Sanctions Program","def":"Setting firm-wide anti-money laundering and sanctions policy, screening and reporting."},{"name":"Trade Surveillance & Compliance Testing","def":"Surveilling trading for market abuse and testing that compliance policies work as designed."},{"name":"Policy Library & Attestations","def":"Maintaining the firm's policies and their versions, collecting employee attestations and reviewing the compliance program."},{"name":"Restricted Lists & Information Barriers","def":"Escalating material nonpublic information, maintaining restricted, watch and insider lists and enforcing information barriers."}],"info":{"close":"Regulatory change and pay-to-play reviews."},"scope":{"fin":0,"fall":9,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":2,"out":7}},{"n":"39","code":"LG","name":"Legal & Corporate Governance","area":"CORP","role":"close","afsg":"out","rq":null,"f":[{"code":"LG-CTR","name":"Contract Repository","def":"The enterprise record of every executed legal instrument: what it is, who signed it for which entity, the typed record a business domain keeps for it, its documents, key dates and negotiated clause positions, and the legal service requests that produce contracts and advice.","role":"close","afsg":"","note":"The executed contract behind each agreement.","k":[8,71,23],"o":[{"n":"Contract","k":15},{"n":"Typed Contract Link","k":16},{"n":"Contract Party","k":7},{"n":"Contract Signatory","k":7},{"n":"Contract Document Version","k":9},{"n":"Contract Key Date","k":5},{"n":"Contract Clause Position","k":4},{"n":"Legal Service Request","k":8}]},{"code":"LG-MAT","name":"Legal Matters & Litigation","def":"Disputes, litigation, arbitration, regulatory enforcement and subpoena responses the firm or its funds are party to: parties, events and deadlines, the dated loss contingency assessment, and the outside counsel engaged and their invoices. Examinations and inquiries are 38; a formal investigation, subpoena or Wells notice is a matter here.","role":"out","afsg":"","note":"","k":[6,49,16],"o":[{"n":"Legal Matter","k":13},{"n":"Matter Party","k":5},{"n":"Matter Event","k":6},{"n":"Matter Financial Assessment","k":10},{"n":"Outside Counsel Engagement","k":6},{"n":"Outside Counsel Invoice Review","k":9}]},{"code":"LG-PRS","name":"Legal Holds & Preservation","def":"Legal holds that suspend record disposal while litigation, investigation or a regulatory exam is pending or reasonably anticipated: who must preserve, what is covered and when the hold was issued, acknowledged and released. Retention rules stay in 08; the 02 and 08 legal hold indicators are copies of Legal Hold Scope.","role":"out","afsg":"","note":"","k":[3,25,10],"o":[{"n":"Legal Hold","k":8},{"n":"Legal Hold Custodian","k":7},{"n":"Legal Hold Scope","k":10}]},{"code":"LG-CGV","name":"Corporate Entity Governance","def":"Boards and committees of the group's own companies (holding company, adviser, broker-dealer, service companies, carry vehicles), their members and officers, their meetings and resolutions, what each resolution approved, and the statutory filings the companies make. Fund boards, boards of fund-management entities (ManCo, AIFM, ACD, CIT trustee committee) and boards of private fund general partners are 35; entity identity and ownership are 09.","role":"out","afsg":"","note":"","k":[7,55,20],"o":[{"n":"Corporate Governing Body","k":8},{"n":"Corporate Body Membership","k":7},{"n":"Corporate Officer Appointment","k":6},{"n":"Corporate Board Meeting","k":6},{"n":"Corporate Resolution","k":6},{"n":"Corporate Resolution Subject Link","k":15},{"n":"Entity Statutory Filing","k":7}]},{"code":"LG-SGN","name":"Signing Authority","def":"Who may act and sign for each internal entity: powers of attorney granted to employees or outside attorneys-in-fact, and signing authority grants by authority type and limit. Bank account mandates and their signatories are 43.","role":"out","afsg":"","note":"","k":[2,16,8],"o":[{"n":"Power of Attorney","k":9},{"n":"Signing Authority Grant","k":7}]},{"code":"LG-IPR","name":"Intellectual Property","def":"Trademark registrations that protect the firm's corporate and product names, their docket deadlines, and licenses to use them. the corporate brand standard is 42; 39 holds the legal registration.","role":"out","afsg":"","note":"","k":[3,22,6],"o":[{"n":"Trademark Registration","k":10},{"n":"Trademark Docket Deadline","k":5},{"n":"Trademark License Grant","k":7}]}],"caps":[{"name":"Contract Management","def":"Keeping the enterprise contract repository and tracking contract terms, renewals and obligations."},{"name":"Legal Matters & Holds","def":"Managing litigation and legal matters and applying legal holds to records."},{"name":"Corporate Secretarial & Entity Governance","def":"Governing internal legal entities, their boards, resolutions, officers and signing authorities, and protecting trademarks."}],"info":{"close":"The executed contracts behind distribution agreements."},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":1,"out":5}},{"n":"40","code":"VM","name":"Procurement & Vendor Management","area":"CORP","role":"out","afsg":"close","rq":null,"f":[{"code":"VM-SUP","name":"Supplier Management","def":"The supplier record kept for every external party the firm buys from: the supplier profile and its dated status, the remittance details used to pay it, onboarding and screening cases, what the firm buys from it (supplier engagements, linked to the data-vendor, servicing, custody and fund service specializations) and how each engagement is categorized. Party identity, LEI, addresses, contacts, tax forms and TINs are mastered in 02.","role":"out","afsg":"","note":"","k":[5,44,12],"o":[{"n":"Supplier Profile","k":9},{"n":"Supplier Remittance Detail","k":7},{"n":"Supplier Onboarding Case","k":7},{"n":"Supplier Engagement","k":16},{"n":"Supplier Category Assignment","k":5}]},{"code":"VM-SRC","name":"Sourcing","def":"Competitive and non-competitive sourcing events the firm issues to suppliers (RFI, Sourcing RFP, RFQ, reverse auction, single-source justification), the suppliers invited and their bids, and the award to each winning supplier. RFPs and DDQs the firm receives from clients and consultants are 03 RFP Requests (RFP-), not sourcing events.","role":"out","afsg":"","note":"","k":[3,22,7],"o":[{"n":"Sourcing Event","k":8},{"n":"Sourcing Invitation","k":5},{"n":"Sourcing Award","k":9}]},{"code":"VM-PUR","name":"Purchasing","def":"The purchase-to-pay chain on the procurement side: requisitions, purchase orders and their lines, goods and service receipts and the match of each 19 payable invoice line to a purchase order line. The invoice, its header amounts and taxes, and the payment are mastered in 19.","role":"out","afsg":"","note":"","k":[5,51,22],"o":[{"n":"Purchase Requisition","k":7},{"n":"Purchase Order","k":9},{"n":"Purchase Order Line","k":13},{"n":"Goods and Service Receipt","k":7},{"n":"Invoice Match Result","k":15}]},{"code":"VM-CON","name":"Supplier Contracts","def":"The procurement terms of supplier contracts and their contracted service levels. Each supplier contract is a 39 Contract (CTRCT-); 39 masters its dates, parties, governing law and clauses, and the profile here holds none of them.","role":"out","afsg":"","note":"","k":[2,16,3],"o":[{"n":"Supplier Contract Profile","k":9},{"n":"Contracted Service Level","k":7}]},{"code":"VM-PRF","name":"Supplier Performance & Spend","def":"How suppliers perform and what the firm spends with them: periodic performance reviews of engagements, measured results against contracted service levels and spend summaries by supplier, buying entity and fiscal period. Row rule: each engagement is performance-reviewed in exactly one domain by engagement type: 14 Vendor Performance Review for data-vendor engagements, 13 oversight reviews for servicing provider engagements, 28 Custodian Service Reviews for custody engagements, and 40 Supplier Performance Review for every other engagement.","role":"out","afsg":"","note":"","k":[3,19,5],"o":[{"n":"Supplier Performance Review","k":5},{"n":"Service Level Measurement Result","k":7},{"n":"Supplier Spend Summary","k":7}]},{"code":"VM-OUT","name":"Criticality & Outsourcing","def":"How critical each engagement is and the regulatory registers of third-party arrangements: the inherent criticality tier that sets due-diligence depth (residual risk is 37's), outsourcing arrangements with exit plans and regulator notifications, and the DORA register of information with its ICT supply chain. 14 ICT Third-Party Register Entry becomes the data-vendor view of the register.","role":"out","afsg":"close","note":"","k":[7,67,20],"o":[{"n":"Supplier Risk Tiering","k":6},{"n":"Outsourcing Arrangement","k":13},{"n":"Exit Plan","k":4},{"n":"Outsourcing Notification","k":6},{"n":"ICT Register Arrangement Header","k":14},{"n":"ICT Register of Information Entry","k":17},{"n":"Supply Chain Subcontractor","k":7}]}],"caps":[{"name":"Fund Service Provider Oversight","def":"Overseeing outsourced fund administrators, custodians and transfer agents against service levels and board reporting needs."},{"name":"Procurement & Supplier Management","def":"Sourcing and buying goods and services and tiering and monitoring supplier performance, spend and criticality."},{"name":"Outsourcing & ICT Third-Party Register","def":"Keeping the outsourcing register with its exit plans and regulator notifications and the DORA register of information on ICT third-party providers."}],"info":{},"scope":{"fin":0,"fall":6,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":0,"out":6}},{"n":"41","code":"IT","name":"Technology & Information Security","area":"CORP","role":"close","afsg":"close","rq":null,"f":[{"code":"IT-APL","name":"Application Portfolio","def":"The enterprise application inventory: every business application, platform, end-user tool and AI system the firm runs, buys as a service or relies on at a provider, with its ownership, the business capabilities it supports, dated lifecycle assessments, its interfaces, its recovery profile and, for AI systems, the deployer facts and the AI use cases it serves.","role":"close","afsg":"","note":"Applications such as the CRM and marketing platforms.","k":[9,60,17],"o":[{"n":"Application","k":16},{"n":"Application Ownership Assignment","k":5},{"n":"Application Capability Mapping","k":6},{"n":"Application Lifecycle Assessment","k":7},{"n":"Application Interface","k":9},{"n":"Application Recovery Profile","k":5},{"n":"AI System Profile","k":4},{"n":"AI System Use Case Link","k":4},{"n":"AI System Model Deployment","k":4}]},{"code":"IT-INF","name":"Infrastructure & IT Assets","def":"The configuration management database and IT asset records: configuration items (servers, virtual machines, cloud resources, databases, network and end-user devices, application instances), how they depend on one another, which end-user devices are assigned to whom, and the license position of installed software.","role":"out","afsg":"","note":"","k":[4,26,6],"o":[{"n":"Configuration Item","k":9},{"n":"Configuration Item Relationship","k":5},{"n":"IT Asset Assignment","k":5},{"n":"Software License Position","k":7}]},{"code":"IT-IAM","name":"Identity & Access","def":"Who and what can use the firm's applications: digital identities of staff, external users and services, the access roles each application offers, the effective-dated grants of roles to identities, and the periodic reviews that certify or revoke them. The person and the lifecycle event stay in 20; licensed-data entitlements stay in 14. Which client records an external user may reach, and on what authority, is the 04 Client Digital Entitlement that the grant cites; access review campaigns cover external users too.","role":"out","afsg":"","note":"","k":[5,44,16],"o":[{"n":"Digital Identity","k":10},{"n":"Application Access Role","k":7},{"n":"System Access Grant","k":13},{"n":"Access Review Campaign","k":6},{"n":"Access Review Decision","k":8}]},{"code":"IT-ISM","name":"IT Service & Incident Management","def":"The services technology delivers, and the technical record of what disrupts them: IT incidents of every class (service disruption, security event, data integrity), the security detail of security events including the SEC Regulation S-P customer notification determination, and problem records. The operational incident, its business impact, DORA major-incident classification and the reports to authorities are 37's.","role":"out","afsg":"","note":"","k":[4,53,16],"o":[{"n":"IT Service","k":9},{"n":"IT Incident","k":21},{"n":"Security Incident Detail","k":14},{"n":"Problem Record","k":9}]},{"code":"IT-CHG","name":"Change & Release","def":"Changes to applications and configuration items: the change request and its risk, window and outcome, its approval, the software releases that ship changes, and their deployments to each environment.","role":"out","afsg":"","note":"","k":[4,28,9],"o":[{"n":"Change Request","k":13},{"n":"Change Approval","k":5},{"n":"Release","k":5},{"n":"Release Deployment","k":5}]},{"code":"IT-PPM","name":"Change & Project Portfolio","def":"The firm's portfolio of change: programs and the projects within them (technology, product launch, regulatory, data and infrastructure), their milestones and status reports, and the Project Scope Link, the only record of what a project delivers. 'Portfolio' here never means an 18 investment portfolio.","role":"close","afsg":"","note":"Programs such as SDF.","k":[5,47,10],"o":[{"n":"Change Program","k":7},{"n":"Project","k":16},{"n":"Project Milestone","k":6},{"n":"Project Status Report","k":9},{"n":"Project Scope Link","k":9}]},{"code":"IT-STV","name":"Security Testing & Vulnerabilities","def":"Evidence that technology is secure and recoverable: penetration tests, threat-led penetration tests under DORA, ICT disaster recovery failovers, red team exercises and cyber tabletops, and the vulnerability findings raised by tests and scanners until they are remediated or accepted.","role":"out","afsg":"","note":"","k":[2,26,7],"o":[{"n":"Security & Resilience Test","k":12},{"n":"Vulnerability Finding","k":14}]}],"caps":[{"name":"Application & IT Asset Management","def":"Keeping the inventory of applications, systems of record, interfaces and IT assets and their owners."},{"name":"Information Security & Access Management","def":"Granting and reviewing system access, for workforce and external users alike, testing security and responding to vulnerabilities and security incidents."},{"name":"Change & Project Portfolio Management","def":"Prioritizing and tracking programs, projects and their milestones and scope."},{"name":"IT Service & Incident Management","def":"Running IT services, resolving IT incidents and problems and approving and releasing changes to production."}],"info":{"close":"Applications and change programs such as SDF, STEP and the Salesforce re-platforming."},"scope":{"fin":0,"fall":7,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":2,"out":5}},{"n":"42","code":"CP","name":"Corporate Communications & Public Affairs","area":"CORP","role":"close","afsg":"out","rq":null,"f":[{"code":"CP-BGV","name":"Brand Governance","def":"","role":"close","afsg":"","note":"The brand register and brand measures.","k":[4,28,8],"o":[{"n":"Brand","k":7},{"n":"Brand Standard Version","k":6},{"n":"Brand Use Authorization","k":7},{"n":"Reputation Measurement","k":8}]},{"code":"CP-MED","name":"Media Relations","def":"The firm's relationship with the media: profiles of journalists and outlets (parties in 02), inquiries received, press releases issued, the coverage that results and the employees authorized to speak for the firm.","role":"out","afsg":"","note":"","k":[5,49,12],"o":[{"n":"Media Contact Profile","k":8},{"n":"Media Inquiry","k":10},{"n":"Press Release","k":14},{"n":"Media Coverage Item","k":11},{"n":"Spokesperson Authorization","k":6}]},{"code":"CP-PUB","name":"Corporate Publications","def":"Statements and reports the firm publishes about itself as a company, most of them under a statutory publication duty, and the links to the records in other Data Domains whose figures they publish (42 publishes, others produce).","role":"out","afsg":"","note":"","k":[2,19,6],"o":[{"n":"Corporate Publication","k":12},{"n":"Publication Source Link","k":7}]},{"code":"CP-ICM","name":"Internal Communications","def":"Announcements and messages to the firm's own staff, who they were sent to, and aggregate measures of how they were received.","role":"out","afsg":"","note":"","k":[3,20,4],"o":[{"n":"Internal Communication","k":8},{"n":"Internal Communication Audience","k":7},{"n":"Internal Communication Engagement","k":5}]},{"code":"CP-CRS","name":"Issues & Crisis Communications","def":"Reputational issues and crises the firm manages in public, the statements it issues about them and the plans it keeps ready. The incident, matter or event that triggered an issue is mastered in its own Data Domain and referenced once, from the issue.","role":"out","afsg":"","note":"","k":[3,31,7],"o":[{"n":"Communications Issue","k":16},{"n":"Issue Statement","k":7},{"n":"Crisis Communication Plan","k":8}]},{"code":"CP-GPA","name":"Government Relations & Public Policy","def":"The positions the firm takes on public policy, how it argues them in consultations and meetings with officials, and its memberships of trade associations that lobby on its behalf.","role":"out","afsg":"","note":"","k":[4,33,10],"o":[{"n":"Public Policy Position","k":8},{"n":"Consultation Response","k":8},{"n":"Government Official Contact","k":9},{"n":"Trade Association Membership","k":8}]},{"code":"CP-LOB","name":"Lobbying Disclosure","def":"Registrations under lobbying disclosure regimes (US Lobbying Disclosure Act, EU Transparency Register, US state regimes), the employees designated as lobbyists, and the periodic reports filed. Political contributions reported on LD-203 are mastered in 38 and referenced, never copied.","role":"out","afsg":"","note":"","k":[4,32,17],"o":[{"n":"Lobbying Registration","k":8},{"n":"Registered Lobbyist","k":5},{"n":"Lobbying Disclosure Report","k":14},{"n":"Lobbying Report Issue Line","k":5}]},{"code":"CP-REC","name":"Corporate Events & Recognition","def":"Events the firm holds as a company (not client or prospect marketing events, which are 04) and the entries it submits for awards. Fund and manager award results stay in 11.","role":"out","afsg":"","note":"","k":[2,18,5],"o":[{"n":"Corporate Event","k":8},{"n":"Corporate Award Entry","k":10}]}],"caps":[{"name":"Corporate Brand & Communications","def":"Governing the corporate brand and managing media, internal and crisis communications, corporate publications and corporate events."},{"name":"Government Relations & Lobbying Disclosure","def":"Setting public policy positions, responding to consultations, recording contacts with officials and filing lobbying registrations and disclosure reports."}],"info":{"close":"The brand register and brand measures."},"scope":{"fin":0,"fall":8,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":1,"out":7}},{"n":"43","code":"TY","name":"Corporate Treasury & Capital","area":"CORP","role":"out","afsg":"out","rq":null,"f":[{"code":"TY-BNK","name":"Bank Accounts & Relationships","def":"The firm's own bank accounts: the account record of each group entity at each bank, who may sign or approve payments on it (the bank mandate), how accounts are pooled, the profile of each bank relationship and the fees each bank charges. Fund custody accounts and CASS client money accounts (28 Safekeeping Account) and client accounts (15 Account) are never corporate bank accounts.","role":"out","afsg":"","note":"","k":[5,35,11],"o":[{"n":"Corporate Bank Account","k":11},{"n":"Bank Account Signatory","k":8},{"n":"Cash Pool Membership","k":6},{"n":"Bank Relationship Profile","k":6},{"n":"Bank Fee Statement","k":4}]},{"code":"TY-CSH","name":"Cash Management & Forecasting","def":"What the banks report and what treasury expects: bank statements and their entries, the cash position of each account by value date, cash forecasts and their lines, and the short-term investment of surplus corporate cash. Accounting entries for the same movements are 19's.","role":"out","afsg":"","note":"","k":[6,46,15],"o":[{"n":"Bank Statement","k":7},{"n":"Bank Statement Entry","k":10},{"n":"Cash Position","k":6},{"n":"Cash Forecast","k":5},{"n":"Cash Forecast Line","k":8},{"n":"Short-Term Investment","k":10}]},{"code":"TY-FND","name":"Funding & Intercompany","def":"How the firm and its group entities are funded: debt facilities with their drawdowns and covenant tests, intercompany loans, and capital moved between group entities by dividend, contribution, reduction or share issue. Fund-level borrowing is 30 Fund Credit Facility; the journals and the intercompany balance match are 19's.","role":"out","afsg":"","note":"","k":[5,43,15],"o":[{"n":"Debt Facility","k":9},{"n":"Debt Facility Drawdown","k":8},{"n":"Corporate Covenant Test","k":7},{"n":"Intercompany Loan","k":12},{"n":"Intra-Group Capital Transaction","k":7}]},{"code":"TY-SED","name":"Seed & Co-Investment Capital","def":"The firm's own capital put into its products: seed capital for new funds, ETFs and share classes, incubation of SMA models, GP commitments and co-investment alongside private funds. Seed Capital Commitment is the only master of whether capital is firm seed or co-investment capital; units, NAVs, capital accounts and orders are read from their owners.","role":"out","afsg":"","note":"","k":[4,36,10],"o":[{"n":"Seed Capital Commitment","k":13},{"n":"Seed Capital Movement","k":10},{"n":"Seed Position Valuation","k":8},{"n":"Seed Product Holding","k":5}]},{"code":"TY-CAP","name":"Regulatory Capital & Liquidity","def":"The capital and liquidity each licensed group entity must hold and evidence: the regime it is subject to, each calculation of its requirement and resources with their components, the UK ICARA, and notifications to regulators when thresholds are breached or capital is withdrawn. 19 Regulatory Financial Return files the figures; 43 calculates them.","role":"out","afsg":"","note":"","k":[5,41,16],"o":[{"n":"Regulated Entity Capital Profile","k":10},{"n":"Capital Requirement Calculation","k":11},{"n":"Capital Requirement Component","k":7},{"n":"ICARA Assessment","k":6},{"n":"Capital Adequacy Notification","k":7}]},{"code":"TY-HDG","name":"Corporate FX & Hedging","def":"The firm's own currency, interest rate and seed market exposures and how treasury hedges them: forecast exposures, treasury deals executed with banks and their valuations, hedge accounting designations and effectiveness tests. Orders, executions and OTC trades of managed books, including seed books traded through the order management system, stay in 25 and 26; FX rates and curves are 22's.","role":"out","afsg":"","note":"","k":[5,50,13],"o":[{"n":"Corporate Exposure","k":10},{"n":"Treasury Deal","k":13},{"n":"Treasury Deal Valuation","k":6},{"n":"Hedge Relationship","k":14},{"n":"Hedge Effectiveness Test","k":7}]},{"code":"TY-IPG","name":"Insurance Program","def":"The firm's corporate insurance: errors and omissions (professional indemnity), directors and officers, crime, cyber, property and fiduciary liability policies, their layers and the claims made on them. The fund's Rule 17g-1 fidelity bond stays 35; losses are 37; disputes are 39.","role":"out","afsg":"","note":"","k":[3,28,12],"o":[{"n":"Corporate Insurance Policy","k":11},{"n":"Insurance Coverage Layer","k":7},{"n":"Insurance Claim","k":10}]}],"caps":[{"name":"Corporate Cash, Funding & Hedging","def":"Managing corporate bank accounts, cash, funding and intercompany balances and hedging the firm's own exposures."},{"name":"Seed & Co-Investment Capital","def":"Allocating, tracking and hedging firm capital invested in products, including GP commitments."},{"name":"Regulatory Capital & ICARA","def":"Calculating capital requirements of regulated entities, running the ICARA and notifying regulators of capital adequacy events."},{"name":"Corporate Insurance","def":"Placing the firm's corporate insurance program and managing its coverage layers and claims."}],"info":{},"scope":{"fin":0,"fall":7,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":0,"out":7}},{"n":"44","code":"WS","name":"Workplace & Corporate Services","area":"CORP","role":"out","afsg":"out","rq":null,"f":[{"code":"WS-REP","name":"Real Estate & Sites","def":"The building view of each site the firm occupies: its tenure, area, capacity and certification as an effective-dated profile of the 09 Office Location, the spaces inside it, which org units they are assigned to and how much they are used.","role":"out","afsg":"","note":"","k":[4,28,8],"o":[{"n":"Site Profile","k":10},{"n":"Building Space","k":7},{"n":"Space Assignment","k":5},{"n":"Site Occupancy Measurement","k":6}]},{"code":"WS-LSE","name":"Leases","def":"The leases under which the firm occupies or sublets real estate and leases non-IT equipment, abstracted from the executed 39 contract into the parties, dates, spaces, payments and options the firm must manage, with the lease accounting measurement the Controller produces from them.","role":"out","afsg":"","note":"","k":[5,43,19],"o":[{"n":"Lease","k":11},{"n":"Leased Space","k":6},{"n":"Lease Payment Schedule Line","k":7},{"n":"Lease Option & Critical Date","k":8},{"n":"Lease Accounting Measurement","k":11}]},{"code":"WS-FAC","name":"Facilities & Workplace Services","def":"Facilities management: the building plant, furniture and non-IT equipment the firm maintains, the work orders raised against sites, spaces and assets, planned and statutory maintenance, and space reservations.","role":"out","afsg":"","note":"","k":[4,34,8],"o":[{"n":"Facility Asset","k":8},{"n":"Planned Maintenance Schedule","k":6},{"n":"Facility Work Order","k":13},{"n":"Space Reservation","k":7}]},{"code":"WS-PHS","name":"Physical Security","def":"Corporate security records: who holds which badge and may enter which zone, who visited which site, and security incidents at the firm's sites. System access is 41's; the two meet only through the holder's EMP-.","role":"out","afsg":"","note":"","k":[4,30,8],"o":[{"n":"Access Badge","k":7},{"n":"Physical Access Zone Grant","k":7},{"n":"Visitor Registration","k":8},{"n":"Physical Security Incident","k":8}]},{"code":"WS-HSF","name":"Health & Safety","def":"Workplace health and safety records: injuries, illnesses, near misses and dangerous occurrences with their OSHA and RIDDOR status, workplace risk assessments, and the employees assigned to emergency roles.","role":"out","afsg":"","note":"","k":[3,27,8],"o":[{"n":"Health & Safety Incident","k":12},{"n":"Workplace Risk Assessment","k":8},{"n":"Emergency Role Assignment","k":7}]},{"code":"WS-TNE","name":"Travel & Expense","def":"Employee travel and expense: expense reports and lines, corporate cards and their transactions, travel bookings and expense policy limits. Reimbursement is a 19 or 20 payment, posting a 19 journal, and gifts and entertainment compliance stays in 08.","role":"out","afsg":"","note":"","k":[6,53,14],"o":[{"n":"Expense Report","k":12},{"n":"Expense Line","k":12},{"n":"Corporate Card","k":7},{"n":"Card Transaction","k":6},{"n":"Travel Booking","k":8},{"n":"Expense Policy Limit","k":8}]},{"code":"WS-SUS","name":"Operational Sustainability","def":"The environmental footprint of the firm's own operations: metered utility and waste data by site and the operational greenhouse gas emissions (Scope 1, Scope 2 and operational Scope 3) computed from it and from travel data. Investment-level and financed emissions are 34.","role":"out","afsg":"","note":"","k":[2,24,9],"o":[{"n":"Utility Consumption Record","k":10},{"n":"Operational Emission Record","k":14}]}],"caps":[{"name":"Real Estate & Facilities Management","def":"Managing sites, leases, space and facilities and recording the utility consumption of each site."},{"name":"Travel & Expense Management","def":"Booking employee travel, issuing corporate cards and processing expense reports against expense policy limits."},{"name":"Physical Security, Health & Safety","def":"Controlling physical access to sites, registering visitors and recording physical security and health and safety incidents."},{"name":"Corporate Sustainability Reporting","def":"Calculating the greenhouse gas emissions of the firm's own operations by entity, site and scope and supplying them to corporate sustainability reports and climate disclosures."}],"info":{},"scope":{"fin":0,"fall":7,"o":0,"a":0,"c":0,"own":0,"coown":0,"steward":0,"close":0,"out":7}}],"ref":{"domains":44,"families":370,"objects":1497,"attributes":11809,"cdes":3791},"roleTotals":{"own":{"f":52,"o":233,"a":1474,"c":488},"coown":{"f":10,"o":38,"a":254,"c":77},"steward":{"f":26,"o":111,"a":774,"c":226}},"mission":"Improving people's lives through successful investing.","segments":[["Advisor","Advisor","Financial advisors across brokerage and advisory: wirehouses, banks, independent broker-dealers and registered investment advisors (RIAs)."],["Institutions","Institutions","Defined benefit pensions, public funds, consultants and OCIO; includes Retirement: defined contribution from micro to large market, target date and workplace."],["Strategic","Strategic Relationships","Home offices and gatekeepers at distribution firms; senior executive engagement."],["Insurance","Insurance","Variable annuities, registered index-linked annuities, fixed indexed annuities and a prospective general account client."],["PCS","Private Client Services","High-net-worth clients; also provides Outsourced Advisory Solutions (OAS) to firms."],["Canada","Canada","Canadian mutual funds, ETFs and sub-advisory."]],"vehicles":["American Funds and AFIS mutual funds","Target date funds","529 college savings","Variable annuity funds","Active ETFs and ETF models","SMAs","CITs","Separate accounts","Equity Building Blocks","Custom and retirement income models","Public-Private Solutions (interval funds, TD Blend+)"],"crosswalk":[["SDF","Sales Data Foundation (SDF)","Streamlines territory planning, sales crediting and client data management by migrating from legacy systems to Anaplan, CDM and THOR.","A program, not a data home: it moves records whose owners do not change. Territory planning lives in 07, crediting in 07 and 06, client data in 02.",[["07","CT-TER"],["07","CT-CRR"],["06","TX-ATT"],["02","CC-INT"]]],["CDM","CDM","Client data management target within SDF. AFSG's Atlas also has a product called CDM; the documents do not say whether they are the same.","The intermediary side of 02: firms, offices, teams, financial professionals and their identifiers, with identity resolution of source records in 06.",[["02","CC-INT"],["02","CC-FPR"],["02","CC-PID"],["06","TX-IDR"]]],["Anaplan","Anaplan","Target system within SDF, most likely for territory planning.","Territory models, potential, alignment and goals in 07.",[["07","CT-TER"],["07","CT-GEO"],["07","CT-ALN"],["07","CT-GOL"]]],["THOR","THOR","Target system within SDF; not described further.","Not described: no home proposed until the documents or NACG say what it holds.",[]],["STEP","STEP","Enhanced sales CRM capabilities to increase sales force efficiency.","Sales activities, opportunities and pipeline in 03; call standards in 07.",[["03","SL-ACT"],["03","SL-OPP"],["07","CT-COV"]]],["SFDC","Salesforce re-platforming (SFDC)","Salesforce.com re-platforming.","A system change: the application in 41, its system-of-record designations and element mappings in 21; the records it holds stay in 03, 04 and 02.",[["41","IT-APL"],["21","DG-CAT"]]],["HUB","NACG intelligence hub","Self-service reporting.","Data products, certified metrics and semantic models in 21; reports and dashboards cataloged in 21.",[["21","DG-ANL"],["21","DG-CAT"]]],["PDF","Product data foundations (ETFs, models, PPS)","Build and strengthen data foundations on ETFs, Models, and PPS.","Product and model master in 01, ETF listing terms, distribution availability in 01 and 05; custom models are a candidate gap.",[["01","PRD"],["01","OPS"],["01","DST"],["05","DA-SHF"]]],["INST","Institutional infrastructure","Address Institutional infrastructure needs.","Not described. The institutional record sits in 12 (relationship, reporting), 03 (searches, RFPs, consultants) and 02 (institutional clients).",[["12","IS-SVC"],["03","SL-RFP"],["03","SL-CON"],["02","CC-INS"]]],["MarTech","Journeys and MarTech","Marketing technology and client journeys.","Marketing journeys and marketing systems in 04; enterprise journey definitions in 02.",[["04","MK-JRN"],["04","MK-DMM"],["02","CC-JRN"]]],["Disclosures","Disclosures","On the capabilities roadmap; not described.","Not described. If it means the disclosures in marketing and partner material, the homes would be required disclosures in 08 and payment disclosures in 05; this reading is proposed, not stated.",[["08","DC-REV"],["05","DA-DSC"]]],["GCC","GCC","On the capabilities roadmap; not described, and the abbreviation is not expanded.","Not described: no home proposed.",[]],["AI","AI and content automation","Content automation and generative AI; operationalize AI strategy.","AI use cases and their data approvals in 21; AI systems in 41; content in 04.",[["21","DG-AIG"],["41","IT-APL"],["04","MK-AST"]]],["CIPro","Capital Ideas Pro","Registered-user platform with firm-level personalization; Credit Center and Wealth Planning releases.","A digital property in 04 with portal accounts, engagement and gated content; firm-level personalization is only partly held.",[["04","MK-WEB"],["04","MK-DEN"],["04","MK-DIG"],["04","MK-AST"]]]],"crosswalkNote":"Neither NACG document describes a data platform or a domain model. They name capabilities and programs; each is read here against the reference. Where the documents do not say what a thing is, the page says so and proposes no home.","gapsOpen":[["N1","Advisor portfolio consultations","A record of a consultation in which the firm's portfolio specialists analyze an advisor's client portfolio or model: the requesting advisor or team, the portfolio submitted and its holdings, the analysis produced, the recommendations and what the advisor adopted. Today a consultation can be held only as a sales activity with products discussed.","The portfolio construction desk is one of the services the plan counts as value beyond investments, and its interactions underpin client mindshare.","New family in 03 Sales: Portfolio Consultations (consultation request, submitted portfolio and holdings, analysis and recommendation, adoption outcome), linked to sales activities and opportunities.",[["03","SL-ACT"],["03","SL-OPP"]]],["N2","Insurance products built on the firm's funds","The insurer's product itself: a variable annuity, registered index-linked annuity or fixed indexed annuity, its subaccounts or index options that use the firm's funds, models or strategies, their availability dates and the insurer that issues it. Today the reference holds the agreement with the insurer, an insurer platform as a shelf, and flows attributed to the insurance channel.","Diversifying insurance across variable annuities, RILAs and fixed indexed annuities is a named priority, and variable annuity funds are a core vehicle.","New family in 05 Distribution Agreements & Partners: Insurance Product Placements (insurer product, product type, subaccount or index option, underlying fund, model or strategy, availability dates), linked to the agreement and to attribution in 06.",[["05","DA-AGR"],["05","DA-SHF"],["06","TX-ATT"]]],["N3","Private client relationships","Direct high-net-worth client relationships the firm services: the relationship and household, the relationship manager and team, service tier, the managed accounts and the platform they sit on, reviews, and retention status with reasons. 12 services institutional, sub-advisory, DCIO and platform clients only; 02 holds the parties and households; 15 holds the accounts.","Private Client Services is a client segment with its own retention measure and a move to a new SMA platform.","Widen 12 Institutional Client Servicing & Reporting to private wealth clients: a private-client servicing segment on the service relationship, household-level relationships, and retention status and reason on relationship health.",[["12","IS-SVC"],["12","IS-CRV"],["02","CC-INV"]]],["N4","Service offerings sold alongside investment products","A catalog of the non-investment offerings the firm sells or provides: recordkeeping programs, outsourced advisory services, practice management and subscription platforms, with eligibility, pricing reference and the products they bundle. Today recordkeeping programs exist only as a code on a plan's service arrangement in 16, so opportunities, goals and sales credit cannot name them.","Recordkeeping products sold by NACG and serviced by AFSG, OAS and value-added programs are named in the plan.","New family in 01 Investment Product: Service Offerings (offering, type, eligibility, pricing reference, bundled products), referenced by 03 opportunities, 07 goals and crediting, and 16 service arrangements.",[["16","RP-FID"],["03","SL-OPP"],["07","CT-GOL"]]],["N5","Canadian identifiers and registrations","Canadian identifier schemes for dealers, representatives and funds (FundSERV fund and dealer codes, national registration numbers, self-regulatory organization membership) and fund qualification by province. The reference's identifier and registration families cover the US, UK and EU only.","Canada is a client segment with its own mutual funds, ETFs, sub-advisory and territories.","Add Canadian schemes to 02 Party Identifiers and 01 Identifiers & Cross-References, and province-level qualification to 01 Distribution & Registration.",[["02","CC-PID"],["01","IDN"],["01","DST"]]],["N6","Cost data supplied to dealers outside MiFID","The fund cost figures a manufacturer supplies to dealers so they can report total cost to their clients under rules other than MiFID (such as Canada's total cost reporting): the figures, the dealer, the period and the delivery. The reference's dealer cost data exchange covers the MiFID template only; the figures themselves are in 01.","The plan names total cost reporting in Canada as a potential disruptor.","Widen 05 Partner Disclosures & Transparency so Distributor Data Exchange covers any cost-reporting regime, with the regime named on each delivery.",[["05","DA-DSC"],["01","FEE"]]],["N7","Partner-of-choice rankings","Industry studies that rank asset managers as business partners by client segment (advisors, RIAs, home offices, institutions, retirement): the study, the segment surveyed, the peer set, the firm's score and rank, and the attributes rated. 42 holds own brand measures by stakeholder group without peer rank or segment; 11 ranks firms on flows and assets only.","Partner-of-choice rankings are one of the success measures the plan tracks.","New family in 11 Market & Competitive Intelligence: Partner Perception Studies (study, provider, segment, peer set, firm score and rank by attribute).",[["42","CP-BGV"],["11","MI-MSH"],["11","MI-RAT"]]],["N8","Custom and firm-specific models","Whether a model portfolio is a standard model, a firm-specific model or a custom model, the firm, team or advisor it is built for, and the standard model it derives from. 01 holds models with their sponsor platform; constraints and targets are in 24.","Custom and firm models are on the models roadmap, and solutions are a growth priority.","Widen 01 Product & Vehicle so Model Portfolio carries its model type, the party it is built for and its base model.",[["01","PRD"],["24","PM-TGT"],["05","DA-SHF"]]]],"gapHome":{"N1":"03","N2":"05","N3":"12","N4":"01","N5":"02","N6":"05","N7":"11","N8":"01"},"edge":[{"n":"01","code":"SHC","nacg":"close","afsg":"close","note":""},{"n":"01","code":"FEE","nacg":"close","afsg":"close","note":""},{"n":"01","code":"OPS","nacg":"close","afsg":"close","note":""},{"n":"01","code":"REG","nacg":"close","afsg":"close","note":""},{"n":"01","code":"SSP","nacg":"coown","afsg":"close","note":"NACG co-owns the program; AFSG owns accounts and ledger."},{"n":"02","code":"CC-PID","nacg":"steward","afsg":"co  segmentation), AFSG the investor side (identifiers, end investors, relationships, contact points). Where a family serves both, each stewards its own slice and the enterprise owner keeps the party master.",[["02","CC-INT"],["02","CC-FPR"],["02","CC-INV"],["02","CC-INS"],["02","CC-REL"]]],["Marketing & Digital","NACG owns 04. AFSG stewards the servicing websites, visitor identity on them, alert subscriptions and the entitlements for accounts and plans it services.",[["04","MK-WEB"],["04","MK-DIG"],["04","MK-AUD"],["04","MK-DEN"]]],["Distribution agreements","NACG owns 05. AFSG stewards the dealer and networking set-up and the sub-accounting and networking payments its servicing creates.",[["05","DA-OPS"],["05","DA-PPR"]]],["Sales versus the register","The booked transaction and position sit in AFSG's 29 register. 06 holds attributed copies of them beside the records of vehicles AFSG does not keep (ETF secondary market, SMAs, models, CITs), and reconciles to the register. ETF primary-market orders sit outside AFSG.",[["29","TA-REG"],["06","TX-TRN"],["06","TX-DQR"],["29","TA-ETF"]]],["Institutional accounts","15 carves institutional fund and separate account rows out of AFSG's ownership to institutional client servicing, which works in 12. NACG co-owns 12's relationship families; whether institutional client servicing sits in NACG, and so takes those rows, is a decision.",[["15","AC-INT"],["12","IS-SVC"],["01","PRD"]]],["Recordkeeping NACG sells, AFSG services","NACG wins the plan (03 opportunity, 02 plan as client); AFSG sets it up and runs it under a recordkeeping program (16 service arrangement and conversion); plan positions come back to 06 for attribution. The recordkeeping program is not yet an offering NACG can sell against (candidate gap N4).",[["03","SL-OPP"],["02","CC-INS"],["16","RP-FID"],["16","RP-ONB"],["06","TX-POS"]]],["529 and ABLE programs","NACG co-owns the programs with the product owner; AFSG owns the accounts in them and the ledger, and stays close to the program.",[["01","SSP"],["15","AC-SPA"],["29","TA-REG"]]],["Complaints and service experience","Complaints are owned by distribution compliance in 08; AFSG stewards those received through service channels and NACG relies on them. Advisor and sponsor service experience in 13 is read by NACG coverage.",[["08","DC-CPL"],["13","SV-SRQ"],["13","SV-VOC"]]],["Data governance","Each organization stewards its own data products, quality rules, lineage and critical data elements in 21.",[["21","DG-ANL"],["21","DG-DQM"]]]],"decisions":[["Confirm the owned domains","06, 03, 07, 04, 05 and 11, with a named owner for each, and the carve-outs in 07 (incentive plans with HR, payout with payroll and finance) and 11 (peer universes and fee benchmarking with the product owner).",["06","03","07","04","05","11"]],["Agree the 02 co-ownership","NACG co-owns the intermediary hierarchy, financial professionals and segmentation with the enterprise owner of the party master, and stewards its slices of the families AFSG also touches. Name the enterprise owner, and say whether NACG's CDM and Atlas CDM are the same thing.",["02"]],["Settle client digital entitlements","Proposed: NACG owns them as owner of 04, with AFSG stewarding those for the accounts and plans it services. The alternative is a digital channel owner outside both.",["04"]],["Set SDF's scope","Say what SDF masters and what it consumes, and what THOR and CDM are. In the reference SDF spans 02, 06 and 07; moving systems does not move ownership.",["02","06","07"]],["Confirm sales versus the register","The booked record stays in 29; 06 owns attributed copies and every other source, reconciles to 29 and owns the breaks. Agree how ETF, SMA and model flows reach advisors where no account-level data arrives.",["06","29"]],["Name the product master owner for new vehicles","NACG co-owns distribution and the savings programs and stewards models and classifications; name the owner of 01 for ETFs, models and PPS.",["01","36"]],["Decide 12","Co-own institutional client servicing (relationship, reviews, requests) with operations owning production, set-up and billing, or own it outright. Decide whether institutional client servicing sits in NACG, which also decides who owns the institutional rows carved out of 15.",["12","15"]],["Govern external data","NACG stewards the distribution and industry datasets it sponsors in 14 and owns 11; agree who governs licenses and permitted use, and which sources feed market share and partner rankings.",["14","11"]],["Decide the scope of PCS and Canada","Whether both run on the same data foundations as the US advisor and institutional business. The reference holds neither private client servicing nor Canadian identifiers today (candidate gaps N3, N5 and N6).",["12","02"]],["Decide global or regional","Whether the owned domains are global with regional stewards, so capabilities can scale to EACG. The reference supports stewardship scoped by row.",["21"]],["Take the candidate gaps to the reference","N1 to N8, each with a proposed home. Confirm the homes and NACG's role on each.",[]]],"themes":["Clients & intermediaries","Coverage, territories & credit","Sales activity & pipeline","Flows, AUM & attribution","Products & vehicles","Partners & placement","Marketing & engagement","Market & competitive intelligence","Institutions & retirement","Insurance, PCS & Canada","Compliance & conduct","Finance & cost","People","Data, technology & AI"],"sources":{"PLAN":"2031 Plan","BP26":"2026 Business Plan","CAP":"Named capability","DATA":"Data the strategy implies","MEAS":"Measure as a data need","SEG":"Segment need","EDGE":"Shared edge with AFSG"},"uc":[{"id":"D-HIER","title":"One view of firm, office, team and advisor","source":"DATA","theme":"Clients & intermediaries","seg":["Advisor","Strategic"],"status":"covered","homes":[["02","CC-INT",["Distributor Firm","Hierarchy Node","Branch / Office","Advisor Team"]],["02","CC-FPR",["Financial Professional","Employment Affiliation"]], <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const plural = (n, w, p) => `${fmt(n)} ${n === 1 ? w : (p || w + "s")}`;
const BASE_TITLE = "Where NACG data aligns to";

/* ---------- index ---------- */
const DOM = {}; D.doms.forEach(d => DOM[d.n] = d);
const FAM = {}; D.doms.forEach(d => d.f.forEach((f, i) => FAM[f.code] = { d, f, i }));
const ROLE = {}; D.roles.forEach(([k, l, m]) => ROLE[k] = { l, m });
const FROLE = {}; D.froles.forEach(([k, l, m]) => FROLE[k] = { l, m });
const ROLE_ORDER = ["own", "coown", "steward", "close", "out"];
const FROLE_ORDER = ["own", "coown", "steward", "close", "out"];
const INSCOPE = ["own", "coown", "steward"];
const STATUS = { covered: "Covered", partial: "Partly covered", gap: "Gap" };
const STATUS_SHORT = { covered: "Covered", partial: "Partly covered", gap: "Gap" };
const STATUS_ORDER = ["covered", "partial", "gap"];
const SEG = {}; D.segments.forEach(([k, n, w]) => SEG[k] = { n, w });
const SEG_KEYS = D.segments.map(s => s[0]);
const AREA = {}; D.areas.forEach(a => AREA[a.id] = a);
const domsBy = r => D.doms.filter(d => d.role === r);
const GAP = {}; D.gapsOpen.forEach(g => GAP[g[0]] = g);
const andList = xs => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`;
const OPEN_GAPS = D.gapsOpen.length ? `${D.gapsOpen[0][0]} to ${D.gapsOpen[D.gapsOpen.length - 1][0]}` : "";
const NUMWORD = n => ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve"][n] || String(n);
const OWN_ORDER = ["06", "03", "07", "04", "05", "11"];
const SRC_GROUP = { plan: ["PLAN", "BP26"], cap: ["CAP"], data: ["DATA", "MEAS"], seg: ["SEG"], edge: ["EDGE"] };

/* the proposed NACG role for a use case: the role of its primary home; a gap takes the role of the domain it would be added to */
function ucRole(u) {
  if (u.status === "gap") { const n = D.gapHome[u.gap]; return n ? { r: DOM[n].role, n, gap: true } : { r: "", n: "", gap: true }; }
  const h = FAM[u.homes[0][1]]; const fr = h.f.role;
  if (INSCOPE.includes(fr)) return { r: fr, n: h.d.n };
  return { r: h.d.role === "out" ? "out" : "close", n: h.d.n };
}
D.uc.forEach(u => { u.role = ucRole(u); u.segs = u.seg[0] === "All" ? SEG_KEYS : u.seg; });
const UC_BY_DOM = {};
D.uc.forEach(u => new Set(u.homes.map(h => h[0])).forEach(n => (UC_BY_DOM[n] = UC_BY_DOM[n] || []).push(u)));

/* ---------- small renderers ---------- */
const roleChip = (r, opts = {}) => r ? `<span class="rc ${r}${opts.fill ? " f" : ""}${opts.big ? " big" : ""}" title="${esc(opts.title || ROLE[r].m)}">${esc(opts.label || ROLE[r].l)}</span>` : `<span class="rc out">To decide</span>`;
/* a domain's role, with its qualified label where the curated data gives one (07, 11: own, with carve-outs) */
const domRoleChip = (d, opts = {}) => roleChip(d.role, { fill: d.role === "own" || d.role === "coown", ...opts, ...(d.rq ? { label: d.rq.l, title: d.rq.m } : {}) });
const domNum = n => DOM[n].rq ? `${n} (${DOM[n].rq.l.replace(/^Own,\s*/, "").toLowerCase()})` : n;
const froleChip = r => `<span class="rc ${r}" title="${esc(FROLE[r].m)}">${esc(FROLE[r].l)}</span>`;
const afChip = r => r ? `<span class="afb" title="AFSG's role on this family, as in the AFSG view">AFSG <b>${esc(D.afRoleLabel[r] || r)}</b></span>` : "";
const stBadge = s => `<span class="st ${s}">${esc(STATUS[s])}</span>`;
const dhref = (n, code, oi, ai) => `#/domain/${n}` + (code ? `/${encodeURIComponent(code)}` : "") + (oi != null ? `/${oi}` : "") + (ai != null ? `/${ai}` : "");
const domChip = n => { const d = DOM[n]; return `<a class="dchip" style="--rc:var(--r-${d.role})" href="${dhref(n)}"${d.rq ? ` title="${esc(d.rq.l)}: ${esc(d.rq.m)}"` : ""}><b>${n}</b>${esc(d.name)}</a>`; };
const famChip = (n, c) => { const f = FAM[c].f; return `<a class="dchip" style="--rc:var(--r-${f.role});font-size:12.5px" href="${dhref(n, c)}"><b>${n}</b>${esc(f.name)}</a>`; };
const famLink = (n, code) => { const x = FAM[code]; return `<a href="${dhref(n, code)}">${esc(n)} ${esc(x.f.name)}</a>`; };
const segChips = u => (u.seg[0] === "All" ? ["All segments"] : u.seg.map(k => SEG[k].n)).map(f => `<span class="fnc">${esc(f)}</span>`).join(" ");
const counts = list => { const c = { covered: 0, partial: 0, gap: 0 }; (list || D.uc).forEach(u => c[u.status]++); return c; };
function cbar(c) {
  const tot = STATUS_ORDER.reduce((s, k) => s + c[k], 0) || 1;
  return `<div class="cbar" role="img" aria-label="${STATUS_ORDER.map(k => `${c[k]} ${STATUS[k]}`).join(", ")}">${STATUS_ORDER.map(k => c[k] ? `<i class="${k}" style="width:${(100 * c[k] / tot).toFixed(2)}%" title="${c[k]} ${esc(STATUS[k])}"></i>` : "").join("")}</div>`;
}
function homeHtml(h) {
  const [n, code, objs] = h, x = FAM[code];
  return `<div class="home"><a class="hf" href="${dhref(n, code)}">${esc(x.f.name)}</a> <span class="hd" title="${esc(DOM[n].name)}">${n} ${esc(DOM[n].name)}</span>` +
    (objs.length ? `<span class="ho">${objs.map(o => { const oi = x.f.o.findIndex(y => y.n === o); return `<a href="${dhref(n, code, oi)}" style="color:inherit">${esc(o)}</a>`; }).join(" · ")}</span>` : "") + `</div>`;
}

/* ---------- pages ---------- */
function pageOverview() {
  const c = counts(), N = D.uc.length;
  const own = OWN_ORDER.map(n => DOM[n]).filter(d => d && d.role === "own").concat(domsBy("own").filter(d => !OWN_ORDER.includes(d.n)));

  const famsOff = dr => D.doms.filter(d => d.role === dr).reduce((t, d) => t + d.f.filter(f => f.role !== "own").length, 0);
  const edgeDoms = new Set(D.edge.map(e => e.n)).size;

    <div class="chips">${own.map(d => domChip(d.n)).join("")}${co.map(d => domChip(d.n)).join("")}</div>
    <div class="chips">${roleChip("own", { fill: 1 })}<span class="muted" style="font-size:13px">${own.map(d => d.rq ? `<span title="${esc(d.rq.m)}">${esc(domNum(d.n))}</span>` : d.n).join(", ")}</span>
      ${roleChip("coown", { fill: 1 })}<span class="muted" style="font-size:13px">${co.map(d => d.n).join(", ")}</span>
      ${roleChip("steward")}<span class="muted" style="font-size:13px">${st.map(d => d.n).join(", ")}</span>
      ${roleChip("close")}<span class="muted" style="font-size:13px">${cl.map(d => d.n).join(", ")}</span></div>
  </section>

  <section>
    <div class="qa">
      <div class="box"><span class="eyebrow">Question 1</span><div class="q">Are NACG's data use cases captured in the reference taxonomy?</div>
        <p class="a"><b>${c.covered} of ${N}</b> use cases are covered today. <b>${c.partial}</b> are partly covered, and <b>${c.gap}</b> fall in ${D.gapsOpen.length === 1 ? "the candidate gap" : `the ${NUMWORD(D.gapsOpen.length).toLowerCase()} candidate gaps`} (${OPEN_GAPS}) this reading proposes to add to the reference.</p>
        ${cbar(c)}
        <div class="chips">${STATUS_ORDER.map(k => `<a href="#/usecases?status=${k}" style="text-decoration:none">${stBadge(k)}</a> <span class="mono">${c[k]}</span>`).join(" ")}</div>
        <a class="more" href="#/usecases">See every use case and where it lives</a></div>
      <div class="box"><span class="eyebrow">Question 2</span><div class="q">Which domains and families should NACG own, co-own, steward or stay close to?</div>
        <p class="a">Own <b>${own.map(d => domNum(d.n)).join(", ")}</b>: ${famsIn("own", "own")} families owned outright, with ${famsOff("own")} carved out to co-owners, stewards or other owners. Co-own <b>${co.map(d => d.n).join(", ")}</b> with the enterprise owner: ${famsIn("coown", "coown")} families co-owned, ${famsIn("coown", "steward")} stewarded. Steward ${famsIn("steward", "steward")} families in ${st.length} domains owned elsewhere. Stay close to ${cl.length} domains NACG depends on, AFSG's four among them.</p>
        <div class="chips">${ROLE_ORDER.slice(0, 4).map(r => `${roleChip(r)} <span class="mono">${roleCount(r)}</span>`).join(" ")}</div>
        <a class="more" href="#/landscape">See all ${D.doms.length} domains by role</a></div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>Who NACG serves</h2><p>${esc(D.mission)} Six client segments, each with its own data needs; use cases can be filtered by segment.</p></div>
    <div class="grid g3">${D.segments.map(([k, name, what]) => `<a class="box acc segc" style="text-decoration:none;color:inherit" href="#/usecases?seg=${esc(k)}"><span class="eyebrow">Segment</span><h3>${esc(name)}</h3><p>${esc(what)}</p><span class="mono muted">${plural(D.uc.filter(u => u.seg.includes(k)).length, "use case")} specific to it · ${D.uc.filter(u => u.seg[0] === "All").length} shared by all</span></a>`).join("")}</div>
    <p class="muted" style="margin-top:12px;font-size:14px">Vehicles NACG sells: ${esc(D.vehicles.join(" · "))}.</p>
  </section>

  <section>
    <div class="sec-h"><h2>Where NACG meets AFSG</h2><p>NACG brings assets in; AFSG services the accounts and plans. ${plural(D.edge.length, "family", "families")} in ${edgeDoms} domains carry a role for both. Every NACG role was set around AFSG's: no family has two owners.</p></div>
    <div class="grid">${D.edgeTopics.slice(0, 4).map(([t, x]) => `<div class="box"><h3>${esc(t)}</h3><p>${esc(x)}</p></div>`).join("")}</div>
