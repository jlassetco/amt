# nginx in front of the activation demo: HTTP basic authentication, long timeouts for the assistant's Claude calls,
# and a plain proxy to the app on localhost. install.sh fills @SERVER_NAME@ and @AUTH@.
# TLS: put a certificate on this server block (certbot --nginx on a public name) or terminate TLS on a load balancer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAME@;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/html text/css application/json application/javascript;

    location / {
@AUTH@
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765/api/state;
        proxy_read_timeout 10s;
    }
}
